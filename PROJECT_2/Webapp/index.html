<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SicuraFlow - Demo HTML</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #374151;
      --muted: #6B7280;
      --line: #e5e7eb;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green: #0f766e;
      --red: #b43f30;
      --amber: #b06b16;
      --purple: #7651c7;
      --ink: #111827;
      --cyan: #0891b2;
      --shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
      --shadow-soft: 0 2px 16px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 8px 40px rgba(0, 0, 0, 0.07);
      --radius-card: 24px;
      --radius-btn: 12px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f2f8;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.6;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .choice:hover,
    .industrial-choice:hover,
    .report-summary:hover,
    .notification-item:hover,
    .metric-card:hover,
    .chart-card:hover {
      transform: translateY(-2px);
    }

    .hidden { display: none !important; }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }

    .login-box {
      width: min(460px, 100%);
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-card);
      box-shadow: 0 16px 48px rgba(0,0,0,0.3);
      padding: 36px;
      position: relative;
      overflow: hidden;
      color: #f8fafc;
    }

    .login-box .brand h1 {
      color: #f8fafc;
    }
    .login-box .brand .muted {
      color: #94a3b8;
    }

    .login-box::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--blue), var(--cyan), var(--green));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #4f46e5;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 18px rgba(20, 99, 217, 0.22);
    }

    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { color: var(--ink); font-weight: 700; letter-spacing: -0.02em; }
    h2 { font-size: 1.55rem; }
    h3 { font-size: 1.05rem; }
    .muted { color: var(--muted); font-weight: 500; }



    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.86rem;
      font-weight: 700;
      color: #334155;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      color: var(--text);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea { resize: vertical; min-height: 96px; }

    .primary-btn, .secondary-btn, .danger-btn, .ghost-btn {
      min-height: 42px;
      border-radius: var(--radius-btn);
      padding: 0 18px;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: -0.01em;
    }

    .primary-btn {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
    }
    .primary-btn:hover { background: var(--blue-dark); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3); }
    .secondary-btn { background: #fff; color: #374151; border: 1px solid #e5e7eb; box-shadow: var(--shadow-soft); }
    .secondary-btn:hover { border-color: #d1d5db; }
    .danger-btn { background: #dc2626; color: #fff; border: 1px solid #b91c1c; }
    .danger-btn:hover { background: #b91c1c; }
    .ghost-btn { background: transparent; color: var(--blue); }

    /* Tasto Ferma - Palette Rosso Chiaro */
    button[data-stop-record] {
      background: #fef2f2 !important;
      color: #dc2626 !important;
      border: 1px solid #fca5a5 !important;
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.05);
    }
    button[data-stop-record]:hover:not(:disabled) {
      background: #fee2e2 !important;
      border-color: #f87171 !important;
      color: #991b1b !important;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1);
    }
    button[data-stop-record]:disabled {
      background: #f3f4f6 !important;
      color: #9ca3af !important;
      border-color: #e5e7eb !important;
      box-shadow: none !important;
      cursor: not-allowed !important;
    }

    /* Tasto Salva e Trascrivi - Palette Verde Chiaro */
    button[data-save-record] {
      background: #f0fdf4 !important;
      color: #16a34a !important;
      border: 1px solid #bbf7d0 !important;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.05);
    }
    button[data-save-record]:hover:not(:disabled) {
      background: #dcfce7 !important;
      border-color: #86efac !important;
      color: #15803d !important;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.1);
    }
    button[data-save-record]:disabled {
      background: #f3f4f6 !important;
      color: #9ca3af !important;
      border-color: #e5e7eb !important;
      box-shadow: none !important;
      cursor: not-allowed !important;
    }

    /* Zona Drag and Drop */
    .drag-drop-zone {
      border: 2px dashed #cbd5e1 !important;
      border-radius: 12px !important;
      padding: 30px 20px !important;
      text-align: center !important;
      background: #f8fafc !important;
      cursor: pointer !important;
      transition: border-color 0.15s, background-color 0.15s, transform 0.15s !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      margin-top: 14px !important;
    }
    .drag-drop-zone:hover, .drag-drop-zone.dragover {
      border-color: var(--blue) !important;
      background-color: rgba(37, 99, 235, 0.04) !important;
    }
    .drag-drop-zone .upload-icon {
      color: #64748b !important;
      transition: color 0.15s, transform 0.15s !important;
    }
    .drag-drop-zone:hover .upload-icon, .drag-drop-zone.dragover .upload-icon {
      color: var(--blue) !important;
      transform: translateY(-2px) !important;
    }
    .drag-drop-zone .drop-text {
      margin: 0 !important;
      font-size: 0.95rem !important;
      font-weight: 600 !important;
      color: #334155 !important;
    }
    .drag-drop-zone .browse-link {
      color: var(--blue) !important;
      text-decoration: underline !important;
    }
    .drag-drop-zone .supported-formats {
      font-size: 0.75rem !important;
      color: #94a3b8 !important;
    }

    .login-users-list {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    }

    .user-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }

    .user-card-info strong {
      display: block;
      color: #f8fafc;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .user-card-info span {
      display: block;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .user-card svg {
      color: #64748b;
      transition: color 0.15s, transform 0.15s;
    }

    .user-card:hover svg {
      color: #93c5fd;
      transform: translateX(2px);
    }


    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 276px 1fr;
      align-items: start;
    }

    .sidebar {
      background: #0f172a;
      color: #f8fafc;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 10px 0 28px rgba(0, 0, 0, 0.15);
      border-right: none;
      min-height: 100vh;
      align-self: stretch;
      position: sticky;
      top: 0;
    }

    .sidebar .brand-mark { background: #4f46e5; color: #fff; }
    .sidebar .muted { color: #94a3b8; }
    .sidebar .brand strong { color: #f8fafc; }

    .user-box {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px 18px;
      background: rgba(255, 255, 255, 0.04);
      box-shadow: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-box strong {
      font-size: 1.25rem;
      color: #f9fafb;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .user-box .muted {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
      color: #94a3b8;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      min-height: 48px;
      border-radius: 12px;
      padding: 11px 14px;
      color: #94a3b8;
      background: transparent;
      border: 1px solid transparent;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.18s ease;
    }

    .nav button.active, .nav button:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.2);
      color: #e0f2fe;
      box-shadow: inset 4px 0 0 var(--cyan);
    }

    .sidebar-footer { margin-top: auto; }

    .sidebar-panel {
      border: 0;
      border-radius: 14px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      box-shadow: none;
    }

    .sidebar-panel-title {
      color: #64748b;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 0;
    }

    .sidebar-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sidebar-stat {
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(135deg, #eff6ff, #ffffff);
      border: 0;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.08);
    }

    .sidebar-stat:nth-child(2) { background: linear-gradient(135deg, #ecfdf5, #ffffff); box-shadow: inset 0 0 0 1px rgba(22, 163, 74, 0.09); }
    .sidebar-stat:nth-child(3) { background: linear-gradient(135deg, #fff7ed, #ffffff); box-shadow: inset 0 0 0 1px rgba(217, 119, 6, 0.10); }
    .sidebar-stat:nth-child(4) { background: linear-gradient(135deg, #f5f3ff, #ffffff); box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.10); }

    .sidebar-stat.clickable {
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
    }

    .sidebar-stat.clickable:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
    }

    .sidebar-stat strong {
      display: block;
      color: var(--ink);
      font-size: 1.55rem;
      line-height: 1;
      margin-bottom: 6px;
    }

    .sidebar-stat span {
      color: #52657f;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .quick-actions {
      display: grid;
      gap: 8px;
    }

    .quick-actions button {
      min-height: 44px;
      border-radius: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border: 0;
      text-align: left;
      font-weight: 600;
      font-size: 0.88rem;
      width: 100%;
      transition: filter 0.18s, transform 0.18s;
    }

    .quick-actions button:nth-child(1) { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
    .quick-actions button:nth-child(2) { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
    .quick-actions button:nth-child(3) { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; }
    .quick-actions button:nth-child(4) { background: rgba(249, 115, 22, 0.15); color: #fdba74; }
    .quick-actions button:nth-child(5) { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

    .quick-actions button:hover {
      filter: brightness(1.2);
      transform: translateY(-1px);
    }

    .support-box {
      width: 100%;
      margin-top: 8px;
      padding: 10px 14px;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(45, 212, 191, 0.1));
      color: #7dd3fc;
      text-align: left;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: filter 0.18s, transform 0.18s;
      display: flex;
      align-items: center;
    }

    .support-box:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .support-box span {
      display: block;
      margin-top: 4px;
      color: #52657f;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .support-ticket-panel {
      max-width: 920px;
    }

    .session-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 999px;
      background: #dcfce7;
      color: #0f766e;
      font-size: 0.82rem;
      font-weight: 900;
    }

    .session-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.14);
    }

    main {
      padding: 32px;
      overflow: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(214, 222, 232, 0.9);
    }

    .topbar-left {
      min-width: 220px;
    }
    
    #pageTitle {
      font-size: 2.2rem;
      margin-bottom: 4px;
    }
    
    #pageSubtitle {
      font-size: 1.1rem;
    }

    .topbar-search {
      flex: 1;
      max-width: 680px;
      min-height: 48px;
      border-radius: 999px;
      border: 1px solid #dbe4ef;
      background: #ffffff;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      color: #94a3b8;
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid #dbe4ef;
      background: #ffffff;
      box-shadow: var(--shadow-soft);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 14px;
      border-left: 1px solid #cbd5e1;
      font-weight: 800;
      white-space: nowrap;
      position: relative;
      cursor: pointer;
      background: transparent;
      color: var(--ink);
    }

    .user-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 180px;
      padding: 8px;
      border: 1px solid #dbe4ef;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: var(--shadow-hover);
      z-index: 20;
    }

    .user-menu.hidden {
      display: none;
    }

    .user-menu button {
      width: 100%;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      box-shadow: var(--shadow-soft);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-soft);
      padding: 28px;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .panel:hover {
      box-shadow: var(--shadow-hover);
      border-color: #d1d5db;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .choice {
      min-height: 76px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      box-shadow: var(--shadow-soft);
    }

    .choice:hover {
      border-color: var(--blue);
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.12);
    }

    .operator-home {
      max-width: 980px;
    }

    .welcome-panel {
      margin-bottom: 18px;
      border-left: 5px solid var(--blue);
      background: linear-gradient(90deg, rgba(20, 99, 217, 0.08), #fff 48%);
    }

    .industrial-choice {
      min-height: 96px;
      border: 1px solid #d9e4f2;
      background: #eef4fb;
      border-radius: 22px;
      padding: 20px 24px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      box-shadow: none;
      color: #48627f;
    }

    .choice-emoji {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-bottom: 6px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .industrial-choice strong {
      color: #111827;
      font-size: 1.2rem;
      line-height: 1.2;
    }

    .industrial-choice:hover {
      border-color: var(--cyan);
      background: #e7f7fa;
      box-shadow: inset 0 0 0 1px rgba(16, 166, 180, 0.18);
      color: #075f68;
    }

    .industrial-choice:hover strong {
      color: #075f68;
    }

    .audio-options {
      max-width: 820px;
    }

    .audio-action {
      min-height: 118px;
      justify-content: flex-start;
    }

    .csv-export-btn {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .csv-export-btn:hover {
      filter: brightness(0.95);
    }

    .recording-status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 700;
    }

    .recording-status.live {
      border-color: #fecaca;
      background: #fff1f2;
      color: var(--red);
    }

    .stepper {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      max-width: 760px;
    }

    .step {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      background: #edf3fa;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
    }

    .step:not(:first-child)::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 50%;
      width: 10px;
      height: 10px;
      border-top: 3px solid #cbd5e1;
      border-right: 3px solid #cbd5e1;
      transform: translateY(-50%) rotate(45deg);
    }

    .step.done::before,
    .step.active::before {
      border-color: var(--cyan);
    }

    .step.active {
      border: 1px solid rgba(16, 166, 180, 0.45);
      background: #d9f3f6;
      color: #075f68;
    }

    .step.done {
      background: #e7f7fa;
      color: #0f7d88;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .badge {
      display: inline-flex;
      align-items: center;

      display: inline-flex;

      width: 18px;

    .kpi {
      min-height: 116px;
      padding: 18px 20px;
      border-left: 0;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
    }

    .kpi::after {
      content: "";
      position: absolute;
      left: 20px;
      right: auto;
      top: 0;
      width: 72px;
      height: 3px;
      border-radius: 0 0 999px 999px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));

    .kpi::before {
      content: none;
    }

    .kpi strong {
      display: block;
      font-size: 2.15rem;
      line-height: 1;
      margin-top: 14px;
      color: var(--ink);
      letter-spacing: 0;
    }

    .kpi .muted {
      display: block;
      color: #52657f;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .manager-welcome {
      margin-bottom: 16px;

      background: #ffffff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.07);

      overflow: hidden;

      content: "";
      position: absolute;
      inset: 0 auto 0 0;

      background: var(--green);

      margin-bottom: 8px;

      border: 1px solid #d0dae6;
    }

      background: linear-gradient(135deg, var(--blue), var(--cyan));

      box-shadow: 0 8px 18px rgba(20, 99, 217, 0.18);

      display: grid;

      padding: 8px;

      background: #f3f7fb;

      display: grid;
      gap: 12px;
      margin-top: 12px;

      border: 1px solid var(--line);

      background: linear-gradient(180deg, #f7fbff, #ffffff);

      gap: 10px;
      max-height: 280px;

      border-radius: 12px;

      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #1e293b;

      font-weight: 800;
      box-shadow: 0 16px 34px rgba(20, 99, 217, 0.28);

      transition: background 0.2s, transform 0.2s;

      box-shadow: 0 8px 24px rgba(255, 59, 59, 0.4);

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      50% { transform: rotate(-15deg); }
      75% { transform: rotate(10deg); }
    }
    .wiggle-animation {
      animation: wiggle 0.5s ease-in-out;
      animation-iteration-count: 3;
    }

      width: min(380px, calc(100vw - 32px));

      gap: 8px;
      padding: 14px 18px;
      border-top: none;

      padding: 12px;
      background: #fbfdff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.65);
    }

    .detail-item.full { grid-column: 1 / -1; }
    .detail-item span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .quality-row {
      display: grid;
      grid-template-columns: 150px 1fr 92px;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .metric-card {
      min-height: 146px;
    }

    .metric-card strong {
      display: block;
      font-size: 2rem;
      line-height: 1;
      margin: 8px 0;
      color: var(--ink);
    }

    .manager-status-grid {
      margin: 18px 0;
    }

    .manager-status-card {
      border-top: 4px solid var(--blue);
      position: relative;
      cursor: help;
    }

    .manager-status-card[data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 8px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      font-size: 0.85rem;
      border-radius: 6px;
      white-space: pre-wrap;
      width: max-content;
      max-width: 250px;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      z-index: 100;
      pointer-events: none;
      font-weight: 500;
      line-height: 1.4;
    }

    .manager-status-card[data-tooltip]:hover::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 2px;
      border-width: 6px;
      border-style: solid;
      border-color: rgba(15, 23, 42, 0.95) transparent transparent transparent;
      z-index: 100;
      pointer-events: none;
    }

    .manager-status-card span {
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.82rem;
    }

    .manager-status-card strong {
      display: block;
      margin: 8px 0;
      color: var(--ink);
      font-size: 2.25rem;
      line-height: 1;
    }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.82rem;
    }

    .trend-badge.positive {
      background: #dcfce7;
      color: #166534;
    }

    .trend-badge.negative {
      background: #fee2e2;
      color: #991b1b;
    }

    .formula {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      background: #eef4fa;
      color: #405066;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .evaluation-note {
      border-left: 4px solid var(--amber);
      background: #fffaf0;
      box-shadow: none;
    }

    .plant-map {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0 18px;
    }

    .plant-zone {
      min-height: 78px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #f8fafc;
      font-weight: 800;
    }

    .plant-zone.active {
      border-color: var(--red);
      background: #fff1f2;
      box-shadow: inset 0 0 0 2px rgba(180, 63, 48, 0.18);
    }

    .dashboard-plant-map {
      position: relative;
      min-height: 360px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(15, 23, 42, 0.06) 1px, transparent 1px) 0 0 / 64px 64px,
        linear-gradient(rgba(15, 23, 42, 0.06) 1px, transparent 1px) 0 0 / 64px 64px,
        #f8fafc;
    }

    .dashboard-plant-map-inner {
      position: absolute;
      inset: 0;
      transform-origin: center center;
      transition: transform 0.18s ease;
    }

    .map-area {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.74);
      color: #334155;
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
      padding: 8px;
    }

    .map-area.stampa { border-color: #2563eb; background: rgba(239, 246, 255, 0.82); }
    .map-area.assemblaggio { border-color: #16a34a; background: rgba(240, 253, 244, 0.82); }
    .map-area.saldatura { border-color: #dc2626; background: rgba(254, 242, 242, 0.82); }
    .map-area.magazzino { border-color: #d97706; background: rgba(255, 251, 235, 0.82); }

    .plant-zoom-controls {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-soft);
    }

    .plant-zoom-controls button {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 6px;
      font-size: 1rem;
      line-height: 1;
    }

    .plant-zoom-value {
      min-width: 46px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
    }

    .incident-dot {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-radius: 999px;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.24);
      transform: translate(-50%, -50%);
      cursor: pointer;
    }

    .incident-dot.incidente { background: #f87171; }
    .incident-dot.near { background: #93c5fd; }
    .incident-dot.manutenzione { background: #fcd34d; }
    .incident-dot.rottura { background: #cbd5e1; }

    .incident-dot::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      bottom: 24px;
      min-width: 150px;
      transform: translateX(-50%);
      padding: 7px 9px;
      border-radius: 6px;
      background: #0f172a;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 3;
    }

    .incident-dot:hover::after,
    .incident-dot:focus-visible::after {
      opacity: 1;
    }

    .plant-map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .department-ranking {
      margin-top: 18px;
    }

    .department-ranking-list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .department-ranking-row {
      display: grid;
      grid-template-columns: minmax(140px, 190px) minmax(0, 1fr) 54px;
      gap: 12px;
      align-items: center;
    }

    .department-ranking-row strong {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .department-ranking-bar {
      height: 12px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .department-ranking-bar div {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
    }

    .department-ranking-row span {
      color: var(--ink);
      font-weight: 900;
      text-align: right;
    }

    .notification-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .notification-item {
      border: 1px solid var(--line);
      border-left: 4px solid var(--amber);
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      box-shadow: var(--shadow-soft);
    }

    .bar {
      height: 9px;
      border-radius: 99px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .bar div { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); }

    .success {
      border-color: #bbf7d0;
      background: linear-gradient(135deg, #effdf5, #ffffff);
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        box-shadow: none;
      }
      main { padding: 18px; }
      .grid.two, .grid.three, .grid.four, .detail-grid, .filters, .chart-grid, .manager-analysis-hero, .manager-analysis-controls, .compact-insights-grid, .latest-incident-item, .severity-donut-wrap, .department-ranking-row {
        grid-template-columns: 1fr;
      }
      .department-ranking-row span { text-align: left; }
      .severity-donut { margin: 0 auto; }
      .topbar { flex-direction: column; }
      .topbar-search, .topbar-actions { width: 100%; }
      .topbar-actions { justify-content: space-between; flex-wrap: wrap; }
      .stepper { gap: 16px; }
      .step { min-height: 40px; padding: 0 14px; font-size: 0.92rem; }
      .step:not(:first-child)::before { left: -14px; }
      .dashboard-plant-map { min-height: 460px; }
      table { display: block; overflow-x: auto; }
      .transcription-item { grid-template-columns: 1fr; }
      .floating-chat {
        right: 16px;
        bottom: 16px;
      }
      .floating-chat-button {
        width: 54px;
        height: 54px;
      }
      .quality-row { grid-template-columns: 1fr; }
      .metric-row { grid-template-columns: 1fr; }
      .chat-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <button class="ghost-btn" style="position: absolute; top: 24px; left: 24px; color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(8px);" onclick="openSetupModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      Setup API
    </button>
    <div class="login-box">
      <div style="margin-bottom: 32px; text-align: left;">
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 16px;">
          <div class="brand-mark" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          </div>
          <h1 style="font-size: 2.5rem; line-height: 1.1; font-weight: 800; margin: 0; color: #f8fafc; letter-spacing: -1px;">
            Welcome to<br>
            <span style="color: #3b82f6;">SicuraFlow</span>
          </h1>
        </div>
        <p style="color: #94a3b8; font-size: 1.05rem; line-height: 1.5;">
          Enterprise platform for high-risk industrial safety monitoring and AI reporting.
        </p>
      </div>

      <div id="loginUsersList" class="login-users-list"></div>
    </div>
  </section>

  <section id="appScreen" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </div>
        <div>
          <strong>SicuraFlow</strong>
          <div class="muted" id="portalLabel">Portal</div>
        </div>
      </div>
      <div class="user-box">
        <strong id="userName"></strong>
        <div class="muted" id="userDept"></div>
      </div>
      <nav class="nav" id="mainNav"></nav>
      <div id="sidebarTools"></div>
      <button class="danger-btn" id="logoutBtn" type="button" style="width: 100%;">Logout</button>
    </aside>

    <main>
      <div class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">Dashboard</h2>
          <p class="muted" id="pageSubtitle"></p>
        </div>
        <div class="topbar-search">Cerca cartella, reparto, macchinario...</div>
        <div class="topbar-actions">

          <button class="secondary-btn hidden" id="backBtn">Indietro</button>
          <button class="topbar-user" id="topbarUser" type="button" style="cursor: default;">
            <div class="avatar" id="topbarAvatar">SF</div>
            <span id="topbarName">Utente</span>
          </button>
        </div>
      </div>
      <div id="content"></div>
    </main>
    <div id="floatingChatRoot"></div>
  </section>

  <script>
    const users = [
      { username: 'martina', password: 'password', nome: 'Martina', cognome: 'Rossi', ruolo: 'operator', reparto: 'Reparto Stampa', f: true },
      { username: 'marco', password: 'password', nome: 'Marco', cognome: 'Bianchi', ruolo: 'operator', reparto: 'Reparto Assemblaggio', f: false },
      { username: 'elena', password: 'password', nome: 'Elena', cognome: 'Verdi', ruolo: 'operator', reparto: 'Servizio Prevenzione e Protezione (RSPP)', f: true },
      { username: 'manager1', password: 'password', nome: 'Giuseppe', cognome: 'Verdi', ruolo: 'manager', reparto: 'Direzione Produzione', f: false }
    ];

    function benvenuto() {
      return currentUser.f ? 'Benvenuta' : 'Benvenuto';
    }

    const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';

    function apiUrl(path) {
      return `${API_BASE}${path}`;
    }

    const seedIncidents = [];

    let currentUser = null;
    let activeView = 'operator';
    let selectedIncident = null;
    let operatorStep = 'category';
    let draft = {};
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordedBlob = null;
    let activeDrill = 'general';
    let notificationFilter = 'unread';
    let managerIncidentPreselect = '';
    let reviewEditing = false;
    let managerAudioResult = null;
    let floatingChatOpen = false;
    let plantMapZoom = 1;
    let plantMapPanX = 0;
    let plantMapPanY = 0;
    let incidentChartPeriod = 'month';
    let floatingChatMessages = [];
    let inlineChatMessages = [];
    let qualitaAudioResult = null;
    let qualitaLoading = false;
    let qualitaProgress = 0;
    let chatbotWiggled = false;
    let activeFusionRuns = null;
    let activeFusionRunsIncidentId = null;
    let activeFusionRunsLoading = false;

    const els = {
      loginScreen: document.getElementById('loginScreen'),
      appScreen: document.getElementById('appScreen'),
      userName: document.getElementById('userName'),
      userDept: document.getElementById('userDept'),
      portalLabel: document.getElementById('portalLabel'),
      nav: document.getElementById('mainNav'),
      sidebarTools: document.getElementById('sidebarTools'),
      title: document.getElementById('pageTitle'),
      subtitle: document.getElementById('pageSubtitle'),
      topbarUser: document.getElementById('topbarUser'),
      topbarAvatar: document.getElementById('topbarAvatar'),
      topbarName: document.getElementById('topbarName'),
      content: document.getElementById('content'),
      backBtn: document.getElementById('backBtn'),
      logoutBtn: document.getElementById('logoutBtn'),
      floatingChatRoot: document.getElementById('floatingChatRoot')
    };

    function incident(id, categoria, data, reparto, linea, autore, macchinario, sintesi, fuso) {
      return {
        id, categoria, data, reparto, linea,
        reports: [{
          id_report: `RPT-${id}`,
          autore,
          timestamp_creazione: new Date().toISOString(),
          audio_file: '',
          trascrizione: sintesi,
          report_confermato: null,
          dati: {
            categoria_evento: categoria,
            data_ora: data,
            reparto,
            linea,
            macchinario_coinvolto: macchinario,
            livello_gravita: categoria === 'Incidente' ? 'Media' : 'Bassa',
            dinamica_evento: sintesi,
            cause_probabili: 'Da verificare con responsabile di reparto',
            conseguenze_operatore: categoria === 'Incidente' ? sintesi : 'Nessuna lesione',
            danni_materiali: categoria.includes('Rottura') ? 'Macchinario fermo, ricambio da valutare' : 'Nessuno rilevante',
            azioni_immediate: 'Area messa in sicurezza e responsabile avvisato',
            raccomandazioni_preventive: 'Aggiornare briefing e controlli periodici',
            persone_coinvolte: autore,
            livello_confidenza: 'Alta'
          }
        }],
        report_unificato: fuso
      };
    }

    function getIncidents() {
      let stored = localStorage.getItem('safetyIncidents');
      let items = stored ? JSON.parse(stored) : seedIncidents;
      return items.filter(i => i.reports.some(r =>
        (r.audio_file && r.audio_file !== '') ||
        r.report_confermato?.audio_source ||
        r.dati?.audio_source ||
        r.trascrizione
      ));
    }

    function saveIncidents(items) {
      localStorage.setItem('safetyIncidents', JSON.stringify(items));
    }

    function getChatArchive() {
      return JSON.parse(localStorage.getItem('chatbotQaArchive') || '[]');
    }

    function saveChatArchive(items) {
      localStorage.setItem('chatbotQaArchive', JSON.stringify(items));
    }

    function archiveChatInteraction({ question, answer, source }) {
      if (!selectedIncident) return;
      const now = new Date();
      const record = {
        id: `CHAT-${now.getTime()}`,
        timestamp_iso: now.toISOString(),
        timestamp_locale: now.toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'medium' }),
        incident_id: selectedIncident.id,
        incident_category: selectedIncident.categoria || '',
        incident_department: selectedIncident.reparto || '',
        incident_line: selectedIncident.linea || '',
        user: currentUser ? `${currentUser.nome} ${currentUser.cognome}` : '',
        user_role: currentUser?.ruolo || '',
        chat_source: source,
        question,
        answer,
        question_length: question.length,
        answer_length: answer.length,
        unavailable_answer: normalizeText(answer).includes('informazione non e disponibile') ? 'si' : 'no'
      };
      saveChatArchive([record, ...getChatArchive()]);
    }

    function getNotifications() {
      return JSON.parse(localStorage.getItem('managerNotifications') || '[]').map(item => ({
        ...item,
        level: normalizeNotificationLevel(item),
        type: normalizeNotificationType(item),
        read: Boolean(item.read)
      }));
    }

    function normalizeNotificationLevel(item) {
      if (item.level && item.level !== 'Manager') return item.level;
      const text = `${item.title || ''} ${item.text || ''}`.toLowerCase();
      if (text.includes('near miss')) return 'Near miss';
      if (text.includes('manutenzione')) return 'Operazione di manutenzione';
      if (text.includes('rottura')) return 'Rottura macchinario';
      if (text.includes('incidente') || text.includes('infortunio')) return 'Incidente';
      return item.level || 'Info';
    }

    function normalizeNotificationType(item) {
      if (item.type) return item.type;
      if (item.level === 'Turno') return 'turno';
      if (item.level === 'Soccorsi') return 'soccorsi';
      return 'evento';
    }

    function saveNotifications(items) {
      localStorage.setItem('managerNotifications', JSON.stringify(items));
    }

    function badge(cat) {
      const key = cat === 'Incidente' ? 'incidente' : cat.toLowerCase().includes('near') ? 'near' : cat.toLowerCase().includes('manutenzione') ? 'manutenzione' : 'rottura';
      return `<span class="badge ${key}">${cat}</span>`;
    }

    function setLayout(title, subtitle, showBack) {
      els.title.textContent = title;
      els.subtitle.textContent = subtitle || '';
      els.backBtn.classList.toggle('hidden', !showBack);
    }

    function login(user) {
      currentUser = user;
      els.loginScreen.classList.add('hidden');
      els.appScreen.classList.remove('hidden');
      els.userName.textContent = `${user.nome} ${user.cognome}`;
      els.userDept.textContent = user.reparto;
      els.topbarName.textContent = `${user.nome} ${user.cognome}`;
      els.topbarAvatar.textContent = `${user.nome?.[0] || ''}${user.cognome?.[0] || ''}`;
      
      let portalLabel = 'Operator Portal';
      if (user.ruolo === 'manager') portalLabel = 'Manager Portal';
      els.portalLabel.textContent = portalLabel;
      
      const searchBar = document.querySelector('.topbar-search');
      if (searchBar) {
        searchBar.classList.toggle('hidden', user.ruolo === 'operator');
      }

      if (user.ruolo === 'manager') activeView = 'analytics';
      else activeView = 'operator';
      
      operatorStep = 'category';
      renderNav();
      render();
    }

    function renderNav() {
      let items = [];
      if (currentUser.ruolo === 'manager') {
        const gridIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>';

      const SOGLIE_METRICHE = {
          'Cohen_Kappa_globale': { s1: 0.81, s2: 0.61, s3: 0.40, verso: 'alto' },
          'Precision': { s1: 0.85, s2: 0.70, s3: 0.50, verso: 'alto' },

          'CER': { s1: 0.05, s2: 0.15, s3: 0.30, verso: 'basso' },
          'WER': { s1: 0.10, s2: 0.25, s3: 0.40, verso: 'basso' },
          'DTA': { s1: 0.90, s2: 0.75, s3: 0.50, verso: 'alto' },
          'EPR': { s1: 0.10, s2: 0.25, s3: 0.40, verso: 'basso' },
      };

      const INFO_METRICHE = {
          'Cohen_Kappa_globale': `<b>Cosa misura:</b> quanto le N estrazioni dello stesso LLM sono d'accordo tra loro sui campi categorici (Tipo Evento, Gravità, Coinvolgimento). È più sofisticato di un semplice "quante volte coincidono" perché corregge l'accordo che ci sarebbe già per puro caso.<br><br><b>Come viene calcolato:</b> si prendono tutte le coppie possibili di estrazioni (es. con 3 run: coppia 1-2, 1-3, 2-3) e si calcola il kappa medio tra esse sui campi categorici.<br><br><b>Formula:</b> κ = (p₀ − pₑ) / (1 − pₑ) dove p₀ è l'accordo osservato e pₑ è l'accordo atteso per caso.`,
          'Precision': `<b>Cosa misura:</b> su tutto quello che il LLM ha estratto, quanta parte è effettivamente corretta rispetto al ground truth proxy. È la misura del rumore — quanto il sistema "inventa" o distorce.<br><br><b>Come viene calcolata:</b> si confronta ogni campo testuale dell'estrazione con il ground truth proxy usando la similarità Jaccard (soglia 0.45). Se il campo supera la soglia → conteggiato come corretto.<br><br><b>Formula:</b> Precision = campi corretti / (campi corretti + campi estratti errati)`,
          'Recall': `<b>Cosa misura:</b> su tutti i campi presenti nel ground truth proxy, quanti il LLM riesce a recuperare. È la misura della completezza — quanto il sistema "dimentica" informazioni importanti.<br><br><b>Come viene calcolato:</b> stesso meccanismo Jaccard, ma il denominatore cambia: conta i campi presenti nel ground truth che non sono stati recuperati.<br><br><b>Formula:</b> Recall = campi corretti / (campi corretti + campi mancati)`,
          'F1_Score': `<b>Cosa misura:</b> è la sintesi di Precision e Recall in un unico numero. Serve perché i due parametri sono in tensione — un sistema può avere alta Precision estraendo poche cose ma sempre giuste, o alto Recall estraendo tutto ma con molto rumore. L'F1 penalizza gli squilibri.<br><br><b>Formula:</b> F1 = 2 × (Precision × Recall) / (Precision + Recall)`,
          'Consistenza_Lessicale': `<b>Cosa misura:</b> quanto le N estrazioni usano le stesse parole per descrivere gli stessi campi testuali (Dinamica Sintesi, Causa Radice, Macchinario). Non misura se è "giusto", ma se il LLM è stabile — se chiedi la stessa cosa 3 volte, risponde sempre allo stesso modo?<br><br><b>Come viene calcolata:</b> similarità Jaccard media tra tutte le coppie di estrazioni sullo stesso campo, poi media tra i 3 campi monitorati.`,
          'CER': `<b>Cosa misura:</b> l'accuratezza della trascrizione a livello di singolo carattere. Confronta la trascrizione di Gemini con quella corretta manuale usando la distanza di Levenshtein (numero minimo di inserimenti, cancellazioni e sostituzioni di caratteri).<br><br><b>Formula:</b> CER = numero di caratteri errati / numero totale di caratteri nel riferimento`,
          'WER': `<b>Cosa misura:</b> simile al CER ma a livello di parola intera. È più intuitivo del CER e più usato in letteratura per valutare sistemi speech-to-text. Una parola sbagliata conta come 1 errore indipendentemente dalla sua lunghezza.<br><br><b>Formula:</b> WER = numero di parole errate / numero totale di parole nel riferimento`,
          'DTA': `<b>Cosa misura:</b> quanti dei termini tecnici HSE configurati compaiono correttamente nella trascrizione. È specifico per il tuo dominio — un sistema speech-to-text generico spesso trascrive male i tecnicismi industriali ("RSPP" → "rispì", "DPI" → "dipi", ecc.).<br><br><b>Formula:</b> DTA = termini tecnici presenti nella trascrizione / totale termini tecnici configurati`,
          'EPR': `<b>Cosa misura:</b> è la metrica più "sistemica" delle quattro. Stima quanto spesso un problema nella trascrizione si propaga fino a compromettere un campo del JSON finale. Un errore che rimane nella trascrizione ma non altera l'estrazione è meno grave di uno che fa estrarre un campo sbagliato.<br><br><b>Come viene calcolato:</b> per ogni campo testuale estratto, si misura quanto le parole del campo si sovrappongono con le parole della trascrizione. EPR = campi potenzialmente contaminati / campi totali estratti.`

    function plantMap(reparto, linea) {
      const zones = [
        ['Reparto Stampa', 'Linea A'],
        ['Reparto Stampa', 'Linea B'],
        ['Reparto Assemblaggio', 'Linea A'],
        ['Reparto Assemblaggio', 'Linea B'],
        ['Reparto Saldatura', 'Linea C'],
        ['Magazzino', 'Area carrelli']
      ];
      return `<div class="plant-map">${zones.map(([dep, line]) => {
        const active = dep === reparto || line === linea;
        return `<div class="plant-zone ${active ? 'active' : ''}">${dep}<br><span class="muted">${line}</span></div>`;
      }).join('')}</div>`;
    }

    function dashboardPlantMap(items) {
      const areas = [
        { id: 'stampa-a', label: 'Stampa<br>Linea A', x: 6, y: 8, w: 25, h: 28, keys: ['reparto stampa linea a', 'stampa linea a'] },
        { id: 'stampa-b', label: 'Stampa<br>Linea B', x: 6, y: 42, w: 25, h: 28, keys: ['reparto stampa linea b', 'stampa linea b'] },
        { id: 'assemblaggio-a', label: 'Assemblaggio<br>Linea A', x: 38, y: 8, w: 26, h: 28, keys: ['assemblaggio linea a'] },
        { id: 'assemblaggio-b', label: 'Assemblaggio<br>Linea B', x: 38, y: 42, w: 26, h: 28, keys: ['assemblaggio linea b'] },
        { id: 'saldatura-c', label: 'Saldatura<br>Linea C', x: 71, y: 8, w: 23, h: 28, keys: ['saldatura linea c'] },
        { id: 'magazzino', label: 'Magazzino<br>Area carrelli', x: 71, y: 48, w: 23, h: 34, keys: ['magazzino', 'area carrelli', 'carrelli'] }
      ];
      const zoomPct = Math.round(plantMapZoom * 100);
      const fallback = { x: 48, y: 84 };
      const placed = items.map((item, index) => {
        const data = latestAudioReportData(item);
        const category = data.categoria_evento || data.Tipo_Evento || item.categoria || 'Incidente';
        const department = data.reparto || data.Reparto || item.reparto || '';
        const line = data.linea || data.Area_Coinvolta || item.linea || '';
        const location = normalizeText([department, line].filter(Boolean).join(' '));
        const area = areas.find(zone => zone.keys.some(key => location.includes(normalizeText(key))));
        const baseX = area ? area.x + area.w / 2 : fallback.x;
        const baseY = area ? area.y + area.h / 2 : fallback.y;
        const offsetX = ((index % 3) - 1) * 4;
        const offsetY = (Math.floor(index / 3) % 3 - 1) * 4;
        const kind = normalizeCategory(category).toLowerCase();
        const dotClass = kind === 'incidente' ? 'incidente' : kind.includes('near') ? 'near' : kind.includes('manutenzione') ? 'manutenzione' : 'rottura';
        const label = item.id;
        return `<button class="incident-dot ${dotClass}" data-map-incident-open="${item.id}" data-label="${escapeHtml(label)}" title="${escapeHtml(label)}" style="left:${Math.max(4, Math.min(96, baseX + offsetX))}%;top:${Math.max(6, Math.min(94, baseY + offsetY))}%;" aria-label="Apri ${escapeHtml(label)}"></button>`;
      }).join('');
      return `<section class="panel">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;">
          <div>
            <h3>Mappa impianto</h3>
            <p class="muted" style="margin-bottom:0;">I pallini indicano gli incidenti caricati tramite audio. Clicca un punto per aprire la cartella.</p>
          </div>
          <span class="badge pending">${items.length} eventi audio</span>
        </div>
        <div class="dashboard-plant-map" aria-label="Mappa degli incidenti in impianto" style="cursor: ${plantMapZoom > 1 ? 'grab' : 'default'};">
          <div class="dashboard-plant-map-inner" style="transform:scale(${plantMapZoom}) translate(${plantMapPanX / plantMapZoom}px, ${plantMapPanY / plantMapZoom}px);">
            ${areas.map(area => `<div class="map-area ${area.id.split('-')[0]}" style="left:${area.x}%;top:${area.y}%;width:${area.w}%;height:${area.h}%;">${area.label}</div>`).join('')}
            ${placed || '<span class="muted" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:800;">Nessun incidente audio caricato.</span>'}
          </div>
          <div class="plant-zoom-controls" aria-label="Zoom mappa impianto">
            <button class="secondary-btn" type="button" data-plant-zoom="out" aria-label="Riduci zoom">-</button>
            <span class="plant-zoom-value">${zoomPct}%</span>
            <button class="secondary-btn" type="button" data-plant-zoom="in" aria-label="Aumenta zoom">+</button>
            <button class="secondary-btn" type="button" data-plant-zoom="reset" aria-label="Reimposta zoom">100</button>
          </div>
        </div>
        <div class="plant-map-legend">
          <span><i class="legend-dot" style="background:#f87171;"></i>Incidente</span>
          <span><i class="legend-dot" style="background:#93c5fd;"></i>Near miss</span>
          <span><i class="legend-dot" style="background:#fcd34d;"></i>Manutenzione</span>
          <span><i class="legend-dot" style="background:#cbd5e1;"></i>Rottura macchinario</span>
        </div>
        ${renderDepartmentIncidentRanking()}
      </section>`;
    }

    function renderDepartmentIncidentRanking() {
      // Etichetta, Percentuale, Conteggio reale, Colore (coerente con mappa)
      const rows = [
        ['Confezionamento', 34, 12, '#8b5cf6'], // Viola (reparto non in mappa, colore distinto)
        ['Saldatura', 24, 8, '#dc2626'],        // Rosso (.map-area.saldatura)
        ['Stampa', 18, 6, '#2563eb'],           // Blu (.map-area.stampa)
        ['Assemblaggio', 15, 5, '#16a34a'],     // Verde (.map-area.assemblaggio)
        ['Magazzino', 9, 3, '#d97706']          // Arancione (.map-area.magazzino)
      ];
      return `<div class="department-ranking">
        <h3 style="margin-bottom: 2px;">Reparti con piu incidenti</h3>
        <p class="muted" style="font-size: 0.85rem; margin-top: 0; margin-bottom: 8px;">Il numero tra parentesi indica la quantit&agrave; effettiva di incidenti.</p>
        <div class="department-ranking-list" style="margin-top: 8px;">
          ${rows.map(([label, pct, count, color]) => `<div class="department-ranking-row" style="grid-template-columns: minmax(140px, 190px) minmax(0, 1fr) 75px;">
            <strong>${escapeHtml(label)}</strong>
            <div class="department-ranking-bar"><div style="width:${pct}%; background:${color};"></div></div>
            <span style="font-size: 0.9rem;">${pct}% <span class="muted" style="font-weight: 500;">(${count})</span></span>
          </div>`).join('')}
        </div>
      </div>`;
    }

    function latestAudioReportData(incident) {
      const report = latestAudioReport(incident);
      return report.report_confermato || report.dati || {};
    }

    function latestAudioReport(incident) {
      const reports = incident.reports || [];
      return [...reports].reverse().find(item => item.audio_file || item.report_confermato?.audio_source || item.dati?.audio_source) || reports[reports.length - 1] || {};
    }

    function similarIncidents(category) {
      const similar = getIncidents().filter(item => normalizeCategory(item.categoria) === normalizeCategory(category)).slice(0, 3);
      if (!similar.length) return '<p class="muted">Nessun incidente simile registrato.</p>';
      return `<div class="grid">${similar.map(item => {
        const data = currentReportData(item);
        return `<div class="detail-item">
          <strong>${item.id}</strong> ${badge(item.categoria)}
          <p class="muted" style="margin:8px 0;">${data.dinamica_evento || item.reports[0].trascrizione || 'N/D'}</p>
          <span>Esito</span>${data.conseguenze_operatore || 'N/D'}
          <span style="margin-top:8px;">Azione correttiva immediata</span>${data.azioni_immediate || 'N/D'}
        </div>`;
      }).join('')}</div>`;
    }

      const serious = severity === 'Alta' || category === 'Incidente';
      return `<ul style="margin:0;padding-left:20px;">

    function reviewRow(key, label, area) {
      const value = draft[key] || '';
      const readonly = reviewEditing ? '' : 'readonly';
      const control = area
        ? `<textarea name="${key}" ${readonly}>${escapeHtml(value)}</textarea>`
        : `<input name="${key}" value="${escapeHtml(value)}" ${readonly}>`;
      return `<tr><td>${label}</td><td>${control}</td></tr>`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let recognition = null;
    let localTranscription = "";

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;
      
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'it-IT';
      
      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';
        
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        
        const currentText = finalTranscript || interimTranscript;
        if (currentText.trim()) {
          localTranscription = currentText;
          const liveArea = document.getElementById('liveTranscriptionArea');
          if (liveArea) {
            liveArea.textContent = `🎙️ Trascrizione in tempo reale: "${localTranscription}"`;
            liveArea.style.display = 'block';
          }
        }
      };
      
      recognition.onerror = (event) => {
        console.error("Speech recognition error", event.error);
      };
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        alert('Registrazione audio non supportata da questo browser.');
        return;
      }
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      localTranscription = "";
      
      const liveArea = document.getElementById('liveTranscriptionArea');
      if (liveArea) {
        liveArea.textContent = "";
        liveArea.style.display = "none";
      }

      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.addEventListener('dataavailable', event => {
        if (event.data.size > 0) recordedChunks.push(event.data);
      });
      mediaRecorder.addEventListener('stop', () => {
        recordedBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        stream.getTracks().forEach(track => track.stop());
        const preview = document.getElementById('recordingPreview');
        preview.src = URL.createObjectURL(recordedBlob);
        preview.classList.remove('hidden');
        document.querySelector('[data-save-record]').disabled = false;
        
        if (recognition) {
          try {
            recognition.stop();
          } catch(e) {}
        }
        
        let statusMsg = 'Registrazione fermata. Puoi salvare e trascrivere.';
        if (localTranscription) {
          statusMsg += ` Trascritto: "${localTranscription}"`;
        }
        updateRecordingStatus(statusMsg, false);
      });
      
      mediaRecorder.start();
      
      if (!recognition) {
        initSpeechRecognition();
      }
      if (recognition) {
        try {
          recognition.start();
        } catch(e) {
          console.error("Error starting speech recognition:", e);
        }
      }

      document.querySelector('[data-start-record]').disabled = true;
      document.querySelector('[data-stop-record]').disabled = false;
      updateRecordingStatus('Registrazione in corso...', true);
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
      mediaRecorder.stop();
      document.querySelector('[data-stop-record]').disabled = true;
    }

    function updateRecordingStatus(message, live) {
      const status = document.getElementById('recordingStatus') || document.querySelector('.recording-status');
      if (!status) return;
      status.textContent = message;
      status.classList.toggle('live', !!live);
    }

      const scenario = MOCK_SCENARIOS[cat] || MOCK_SCENARIOS['Incidente'];
      
      const finalTrascrizione = localTranscription ? localTranscription : scenario.trascrizione;
      const mockReport = JSON.parse(JSON.stringify(scenario.report));
      
      mockReport.Evento.Data_Ora = new Date().toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' });
      if (localTranscription) {
        mockReport.Evento.Dinamica_Sintesi = localTranscription;
        if (mockReport.Persone_Coinvolte && mockReport.Persone_Coinvolte[0]) {
          mockReport.Persone_Coinvolte[0].Nome = `${currentUser.nome} ${currentUser.cognome}`;
          mockReport.Persone_Coinvolte[0].Ruolo_Aziendale = currentUser.ruolo === 'operator' ? 'Operatore' : 'Manager';
        }
      }
      
      mockReport._meta = {
        fonte: sourceLabel,
        trascrizione: finalTrascrizione
      };
      
      draft.ai_report_multiple = null;
      draft.ai_report = mockReport;
      
      const items = getIncidents();
      let id = nextIncidentId(items);
      draft.semanticMatchMessage = "Analisi offline attivata con successo: creata cartella " + id;
      draft.id_incidente = id;

      Object.assign(draft, ontologyToFlat(draft.ai_report, {
        id,
        data: draft.data_ora || mockReport.Evento.Data_Ora,
        reparto: draft.reparto || currentUser.reparto,
        linea: draft.linea || defaultLineForUser(),
        categoria: draft.categoria_evento,
        autore: draft.autore || `${currentUser.nome} ${currentUser.cognome}`,
        audio_source: sourceLabel,
        timestamp
      }));
      draft.audio_source = draft.audio_source || sourceLabel;
      createAutomaticAlerts(id);
      reviewEditing = false;
      operatorStep = 'review';
      
      updateRecordingStatus("Analisi locale completata.", false);
      const btnGroup = document.querySelector('.actions');
      if (btnGroup) btnGroup.style.display = 'flex';
      
      renderOperator();
    }

    function ontologyToFlat(report, fallback) {
      const ev = report?.Evento || {};
      const lm = report?.Luoghi_e_Mezzi || {};
      const ac = report?.Analisi_Cause || {};
      const co = report?.Conseguenze || {};
      const az = report?.Azioni_Correttive || {};
      const persone = Array.isArray(report?.Persone_Coinvolte) ? report.Persone_Coinvolte : [];
      return {
        ai_report: report || null,
        id_incidente: fallback?.id || '',
        categoria_evento: ev.Tipo_Evento || fallback?.categoria || '',
        data_ora: ev.Data_Ora || 'N/D',
        reparto: lm.Reparto || fallback?.reparto || '',
        linea: lm.Area_Coinvolta || fallback?.linea || '',
        autore: fallback?.autore || (currentUser ? `${currentUser.nome} ${currentUser.cognome}` : ''),
        timestamp_creazione: fallback?.timestamp || new Date().toISOString(),
        audio_source: report?._meta?.fonte || (report?._meta?.fonti || []).join(', ') || fallback?.audio_source || '',
        macchinario_coinvolto: lm.Macchinario_Coinvolto || '',
        livello_gravita: ev.Gravita_Stimata || '',
        persone_coinvolte: persone.map(p => [p.Nome, p.Ruolo_Aziendale, p.Coinvolgimento, (p.Danno_Riportato && p.Danno_Riportato !== 'N/D' ? 'Danno: ' + p.Danno_Riportato : '')].filter(Boolean).join(' - ')).join('; '),
        vittime_danni: persone.filter(p => p.Danno_Riportato && p.Danno_Riportato !== 'N/D' && p.Danno_Riportato !== '').map(p => `${p.Nome} (${p.Ruolo_Aziendale}): ${p.Danno_Riportato}`).join('; '),
        trascrizione: report?._meta?.trascrizione || ev.Dinamica_Sintesi || '',
        dinamica_evento: ev.Dinamica_Sintesi || '',
        cause_probabili: [ac.Causa_Tecnica, ac.Fattore_Umano, ac.Fattore_Ambientale, ac.Causa_Radice].filter(v => v && v !== 'N/D').join('; ') || ac.Causa_Radice || '',
        conseguenze_operatore: [co.Conseguenza_Fisica_Immediata, co.Parte_Corpo_Lesa, co.Giorni_Inabilita_Stimati].filter(v => v && v !== 'N/D').join('; '),
        danni_materiali: [co.Conseguenza_Materiale_Aziendale, co.Fermo_Produzione_Ore].filter(v => v && v !== 'N/D').join('; '),
        azioni_immediate: az.Azione_Correttiva_Immediata || '',
        raccomandazioni_preventive: az.Azione_Correttiva_da_Implementare || '',
        livello_confidenza: 'Alta'
      };
    }

    async function sendAudioToTranscriptionPipeline(audioSource, fileName) {
      const sourceLabel = fileName || 'registrazione_microfono.webm';
      const items = getIncidents();
      const timestamp = new Date().toISOString();
      const displayDate = new Date().toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' });
      draft.audio_source = sourceLabel;
      draft.upload_date = displayDate;
      draft.reparto = draft.reparto || currentUser.reparto;
      draft.linea = draft.linea || defaultLineForUser();
      draft.autore = `${currentUser.nome} ${currentUser.cognome}`;
      draft.timestamp_creazione = timestamp;

      // Inietta un bellissimo contenitore di avanzamento per la trascrizione
      const statusArea = document.getElementById('recordingStatus') || document.querySelector('.recording-status');
      if (statusArea) {
        statusArea.innerHTML = `
          <div class="transcription-progress-container" style="margin-top: 16px; padding: 18px; background: #ffffff; border: 1px solid #bfdbfe; border-radius: 12px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.06); text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span id="progressStepLabel" style="font-size: 0.88rem; color: #1d4ed8; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                <svg class="animate-spin-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                Connessione alla pipeline AI...
              </span>
              <strong id="progressPercent" style="font-size: 1.05rem; color: #1e293b; font-variant-numeric: tabular-nums;">0%</strong>
            </div>
            <div style="background: #e8f0fe; border-radius: 99px; height: 12px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.06); margin-bottom: 8px;">
              <div id="transcriptionProgressBar" style="height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #3b82f6, #0ea5e9); border-radius: 99px; transition: width 0.15s linear;"></div>
            </div>
            <p class="progress-sub-text" style="margin: 0; font-size: 0.78rem; color: #64748b;">Inizializzazione del processo di analisi...</p>
          </div>
          <style>
            @keyframes spin {
              from { transform: rotate(0deg); }
              to { transform: rotate(360deg); }
            }
          </style>
        `;
      }

      const btnGroup = document.querySelector('.actions');
      if(btnGroup) btnGroup.style.display = 'none';

      // Configura il timer dinamico per far avanzare la barra in base allo stato reale
      let currentProgress = 0;
      const progressBar = document.getElementById('transcriptionProgressBar');
      const progressPercent = document.getElementById('progressPercent');
      const progressStepLabel = document.getElementById('progressStepLabel');
      const progressSubText = document.querySelector('.progress-sub-text');

      const updateBar = (pct, stepName, subText) => {
        if (pct < currentProgress && pct !== 0 && pct !== 100) {
          pct = currentProgress; // Impedisce qualsiasi balzo all'indietro
        }
        currentProgress = pct;
        if (progressBar) progressBar.style.width = `${pct}%`;
        if (progressPercent) progressPercent.textContent = `${Math.round(pct)}%`;
        if (progressStepLabel && stepName) {
          progressStepLabel.innerHTML = `
            <svg class="animate-spin-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite; margin-right: 6px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
            ${stepName}
          `;
        }
        if (progressSubText && subText) progressSubText.textContent = subText;
      };

      const progressInterval = setInterval(() => {
        if (currentProgress < 98) {
          let increment = 0.15;
          let step = "Elaborazione...";
          let desc = "Estrazione metadati in corso...";
          
          if (currentProgress < 30) {
            increment = 0.6; // Molto più graduale e naturale
            step = "Invio del file audio...";
            desc = "Caricamento dell'audio sui server sicuri SicuraFlow...";
          } else if (currentProgress < 60) {
            increment = 0.3; // Trascrizione progressiva
            step = "Trascrizione Speech-to-Text...";
            desc = "Gemini sta decodificando l'audio in tempo reale...";
          } else if (currentProgress < 85) {
            increment = 0.15; // Analisi e ragionamento HSE
            step = "Analisi ontologia HSE...";
            desc = "Rilevamento automatico di cause radice, luoghi e gravità...";
          } else {
            increment = 0.05; // Rallentamento finale impercettibile prima dell'arrivo dati
            step = "Associazione cartella...";
            desc = "Verifica somiglianze semantiche con altre segnalazioni...";
          }
          
          const nextVal = Math.min(98, currentProgress + increment);
          updateBar(nextVal, step, desc);
        }
      }, 150);

      let blob = audioSource;
      if (!(blob instanceof Blob)) {
        clearInterval(progressInterval);
        updateRecordingStatus('Errore: formato audio non valido', false);
        if(btnGroup) btnGroup.style.display = 'flex';
        return;
      }

      const formData = new FormData();
      formData.append('file', blob, sourceLabel);

      try {
        const res = await fetch(apiUrl('/api/analyze-audio'), {
          method: 'POST',
          body: formData
        });
        const result = await res.json();
        
        if (result.success) {
          draft.ai_report_multiple = null;
          draft.ai_report = result.data;
          
          updateBar(Math.max(currentProgress, 90), "Ottimizzazione report...", "Gemini ha completato la sintesi ontologica...");
          
          const existing_incidents = items.map(inc => ({
            id: inc.id,
            reparto: inc.reparto,
            linea: inc.linea,
            macchinario_coinvolto: inc.reports[0]?.dati?.macchinario_coinvolto || "N/D",
            dinamica_evento: inc.reports[0]?.dati?.dinamica_evento || inc.reports[0]?.ai_report?.Evento?.Dinamica_Sintesi || "N/D"
          }));

          const matchRes = await fetch(apiUrl('/api/match-incident'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              new_report: draft.ai_report,
              trascrizione: draft.ai_report?._meta?.trascrizione || draft.trascrizione || "",
              existing_incidents
            })
          });
          const matchResult = await matchRes.json();
          let id = nextIncidentId(items);
          draft.semanticMatchMessage = "Nessuna corrispondenza trovata: creata nuova cartella " + id;
          
          if (matchResult.success && matchResult.match_id !== "NEW") {
            id = matchResult.match_id;
            draft.folderId = id;
            draft.semanticMatchMessage = "Il sistema ha associato automaticamente questo report all'incidente " + id;
            const existingFolder = items.find(i => i.id === id);
            if(existingFolder) {
              draft.categoria_evento = existingFolder.categoria;
              draft.reparto = existingFolder.reparto;
              draft.linea = existingFolder.linea;
            }
          }
          draft.id_incidente = id;

          Object.assign(draft, ontologyToFlat(draft.ai_report, {
            id,
            data: draft.data_ora,
            reparto: draft.reparto,
            linea: draft.linea,
            categoria: draft.categoria_evento,
            autore: draft.autore,
            audio_source: sourceLabel,
            timestamp
          }));
          draft.audio_source = draft.audio_source || sourceLabel;
          createAutomaticAlerts(id);

          // Raggiungi istantaneamente il 100%
          clearInterval(progressInterval);
          updateBar(100, "Analisi completata!", "Salvataggio cartella...");

          setTimeout(() => {
            reviewEditing = false;
            operatorStep = 'review';
            renderOperator();
          }, 600);

        } else {
          clearInterval(progressInterval);
          console.warn("Server returned failure, falling back to local simulation:", result.error);
          useLocalFallback(sourceLabel, timestamp);
        }
      } catch (err) {
        clearInterval(progressInterval);
        console.warn("Server connection failed, falling back to local simulation:", err.message);
        useLocalFallback(sourceLabel, timestamp);
      }
    }

    function createAutomaticAlerts(id) {
      const severity = draft.livello_gravita || 'Bassa';
      const now = new Date().toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' });
      const categoria = draft.categoria_evento || 'Incidente';
      const alerts = [
        {
          id: `NTF-${Date.now()}-1`,
          time: now,
          level: categoria,
          type: 'evento',
          read: false,
          title: `Nuova segnalazione ${id}`,
          text: `${categoria} in ${draft.reparto}, ${draft.linea}. Audio ricevuto e report in revisione.`
        },
        {
          id: `NTF-${Date.now()}-2`,
          time: now,
          level: 'Turno',
          type: 'turno',
          read: false,
          title: 'Sospensione turno e fermo macchina',
          text: `Sospensione turno simulata per ${draft.autore}. Fermo macchina richiesto su ${draft.macchinario_coinvolto}.`
        }
      ];
      if (severity === 'Alta' || categoria === 'Incidente') {
        alerts.push({
          id: `NTF-${Date.now()}-3`,
          time: now,
          level: 'Soccorsi',
          type: 'soccorsi',
          read: false,
          title: 'Avviso soccorsi simulato',
          text: 'Gravita potenzialmente critica: predisporre chiamata ai soccorsi secondo procedura aziendale.'
        });
      }
      saveNotifications([...alerts, ...getNotifications()].slice(0, 20));
    }

      return {
        _meta: {
          fonte: report.audio_file || data.audio_source || incident.id,
          trascrizione: report.trascrizione || data.trascrizione || data.dinamica_evento || ''
        },
        Evento: {
          id_evento: incident.id,
          Data_Ora: data.data_ora || incident.data || 'N/D',
          Tipo_Evento: data.categoria_evento || incident.categoria || 'N/D',
          Gravita_Stimata: data.livello_gravita || 'N/D',
          Prima_dell_evento: 'N/D',
          Trigger_Evento_Principale: data.cause_probabili || 'N/D',
          Dinamica_Sintesi: data.dinamica_evento || data.trascrizione || report.trascrizione || 'N/D'
        },
        Luoghi_e_Mezzi: {

    function runManagerIncidentAnalysis() {
      const incidentId = document.getElementById('managerIncidentSelect')?.value;
      const runsInput = document.getElementById('managerAudioRuns');
      const status = document.getElementById('managerAudioStatus');
      const runsPerFile = Math.max(1, Math.min(10, parseInt(runsInput?.value || '3', 10) || 3));
      const incident = getIncidents().find(item => item.id === incidentId);
      if (!incident) {
        if (status) status.textContent = 'Seleziona una segnalazione disponibile.';
        return;
      }
      const report = incident.reports[0] || {};
      const storedRuns = Array.isArray(report.ai_report_multiple) && report.ai_report_multiple.length
        ? report.ai_report_multiple
        : [ontologyFromStoredReport(report, incident)];
      const runs = Array.from({ length: runsPerFile }, (_, index) => ({
        run: index + 1,
        dati: storedRuns[index] || storedRuns[storedRuns.length - 1]
      }));
      managerAudioResult = {
        files: [{
          nome: `${incident.id} - ${incident.categoria}`,
          runs
        }],
        incidentId: incident.id,
        fromStoredIncident: true,
        runs_per_file: runsPerFile
      };
      if (status) status.textContent = `Analisi preparata dalla segnalazione ${incident.id}.`;
      document.getElementById('managerAudioResults').innerHTML = renderManagerAudioResult(managerAudioResult);
    }
