          <p class="muted" style="margin-bottom:0;">${description}</p>
        </section>
        ${payload.files.map((file, fileIndex) => {
          const flats = file.runs.map(run => ({ run: run.run, flat: ontologyToFlat(run.dati, { autore: 'Manager', timestamp: new Date().toISOString() }), dati: run.dati }));
          return `<article class="report-summary">
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;">
              <strong>${escapeHtml(file.nome)}</strong>
              <span class="badge pending">${file.runs.length} analisi</span>
            </div>
            <div class="analysis-actions">
              <span class="muted">Salva analisi:</span>
              ${flats.map(item => `<button class="secondary-btn" data-save-manager-report="repeat:${fileIndex}:${item.run - 1}">Analisi ${item.run}</button>`).join('')}
            </div>
            <h3 style="margin-top:18px;">Report analizzato</h3>
            ${renderManagerReviewStyleComparison(flats)}
            ${renderTranscriptionCards(flats)}
          </article>`;
        }).join('')}
      </div>`;
    }

    function renderTranscriptionCards(items) {
      return `<section class="transcription-panel">
        <h3>Trascrizione</h3>
        <div class="transcription-list">
          ${items.map(item => `<div class="transcription-item">
            <strong>Analisi ${item.run}</strong>
            <div>${escapeHtml(item.flat.trascrizione || 'N/D')}</div>
          </div>`).join('')}
        </div>
      </section>`;
    }

    function renderTranscriptionComparison(items) {
      return `<table class="compare-table">
        <thead><tr><th>Run</th><th>Trascrizione</th><th>Lunghezza</th></tr></thead>
        <tbody>
          ${items.map(item => `<tr><td>Run ${item.run}</td><td>${escapeHtml(item.flat.trascrizione || 'N/D')}</td><td>${wordCount(item.flat.trascrizione)}</td></tr>`).join('')}
        </tbody>
      </table>`;
    }

    function renderManagerReviewStyleComparison(items) {
      const sections = [
        ['Evento', ['id_evento', 'Data_Ora', 'Tipo_Evento', 'Gravita_Stimata', 'Prima_dell_evento', 'Trigger_Evento_Principale', 'Dinamica_Sintesi']],
        ['Luoghi_e_Mezzi', ['Reparto', 'Area_Coinvolta', 'Macchinario_Coinvolto', 'Codice_Macchinario', 'Condizioni_Ambientali']],
        ['Analisi_Cause', ['Causa_Tecnica', 'Fattore_Umano', 'Fattore_Ambientale', 'Causa_Radice']],
        ['Conseguenze', ['Conseguenza_Fisica_Immediata', 'Parte_Corpo_Lesa', 'Giorni_Inabilita_Stimati', 'Conseguenza_Materiale_Aziendale', 'Fermo_Produzione_Ore']],
        ['Azioni_Correttive', ['Procedura_Corretta_Violata', 'DPI_Mancanti_o_Inadeguati', 'Azione_Correttiva_Immediata', 'Azione_Correttiva_da_Implementare', 'Responsabile_Azione', 'Scadenza_Azione']]
      ];
      let rows = '';
      sections.forEach(([section, fields]) => {
        rows += `<tr style="background:#eef4fa;"><td colspan="2" style="font-weight:bold;text-transform:uppercase;">${section.replace(/_/g, ' ')}</td></tr>`;
        fields.forEach(field => {
          rows += `<tr><td colspan="2" style="font-weight:bold; padding-top:10px; color:var(--blue);">${field.replace(/_/g, ' ')}</td></tr>`;
          items.forEach((item, index) => {
            const value = item.dati?.[section]?.[field] || 'N/D';
            rows += `<tr>
              <td style="width:120px; padding-left:20px; color:var(--muted); border-bottom:1px dotted #e2e8f0;">Analisi ${index + 1}:</td>
              <td style="border-bottom:1px dotted #e2e8f0;">
                <input style="width:100%; border:none; background:transparent;" value="${escapeHtml(value)}" readonly>
              </td>
            </tr>`;
          });
        });
      });

      const maxPeople = Math.max(0, ...items.map(item => Array.isArray(item.dati?.Persone_Coinvolte) ? item.dati.Persone_Coinvolte.length : 0));
      if (maxPeople > 0) {
        rows += `<tr style="background:#eef4fa;"><td colspan="2" style="font-weight:bold;text-transform:uppercase;">PERSONE COINVOLTE</td></tr>`;
        for (let personIndex = 0; personIndex < maxPeople; personIndex++) {
          const keys = new Set();
          items.forEach(item => {
            const person = item.dati?.Persone_Coinvolte?.[personIndex];
            if (person) Object.keys(person).forEach(key => keys.add(key));
          });
          rows += `<tr><td colspan="2" style="font-weight:bold; padding-top:10px; color:var(--blue);">Persona ${personIndex + 1}</td></tr>`;
          keys.forEach(key => {
            rows += `<tr><td colspan="2" style="font-style:italic; padding-left:10px;">${key.replace(/_/g, ' ')}</td></tr>`;
            items.forEach((item, index) => {
              const value = item.dati?.Persone_Coinvolte?.[personIndex]?.[key] || 'N/D';
              rows += `<tr>
                <td style="width:120px; padding-left:20px; color:var(--muted); border-bottom:1px dotted #e2e8f0;">Analisi ${index + 1}:</td>
                <td style="border-bottom:1px dotted #e2e8f0;">
                  <input style="width:100%; border:none; background:transparent;" value="${escapeHtml(value)}" readonly>
                </td>
              </tr>`;
            });
          });
        }
      }

      return `<table class="structured-report">
        <thead><tr><th>Campo</th><th>Valore</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    function renderOntologyComparison(items) {
      const fields = [
        ...ontologySectionFields('Evento', ['id_evento', 'Data_Ora', 'Tipo_Evento', 'Gravita_Stimata', 'Prima_dell_evento', 'Trigger_Evento_Principale', 'Dinamica_Sintesi']),
        ...ontologySectionFields('Luoghi_e_Mezzi', ['Reparto', 'Area_Coinvolta', 'Macchinario_Coinvolto', 'Codice_Macchinario', 'Condizioni_Ambientali']),
        ...ontologySectionFields('Analisi_Cause', ['Causa_Tecnica', 'Fattore_Umano', 'Fattore_Ambientale', 'Causa_Radice']),
        ...ontologySectionFields('Conseguenze', ['Conseguenza_Fisica_Immediata', 'Parte_Corpo_Lesa', 'Giorni_Inabilita_Stimati', 'Conseguenza_Materiale_Aziendale', 'Fermo_Produzione_Ore']),
        ...ontologySectionFields('Azioni_Correttive', ['Procedura_Corretta_Violata', 'DPI_Mancanti_o_Inadeguati', 'Azione_Correttiva_Immediata', 'Azione_Correttiva_da_Implementare', 'Responsabile_Azione', 'Scadenza_Azione']),
        ['Persone_Coinvolte', 'Persone_Coinvolte', report => stringifyValue(report.Persone_Coinvolte)]
      ];
      return `<table class="compare-table">
        <thead><tr><th>Campo ontologia</th>${items.map(item => `<th>Run ${item.run}</th>`).join('')}<th>Esito</th></tr></thead>
        <tbody>
          ${fields.map(([path, label, getter]) => {
            const values = items.map(item => getter(item.dati) || 'N/D');
            const stable = new Set(values.map(v => normalizeText(v))).size <= 1;
            return `<tr>
              <td><strong>${label}</strong><br><span class="muted">${path}</span></td>
              ${values.map(value => `<td>${escapeHtml(value)}</td>`).join('')}
              <td><span class="badge ${stable ? 'ok' : 'pending'}">${stable ? 'Stabile' : 'Divergente'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
    }

    function ontologySectionFields(section, fields) {
      return fields.map(field => [
        `${section}.${field}`,
        `${section} / ${field.replace(/_/g, ' ')}`,
        report => report?.[section]?.[field]
      ]);
    }

    function wordCount(value) {
      const words = String(value || '').trim().split(/\s+/).filter(Boolean);
      return words.length;
    }

    async function runManagerAudioAnalysis() {
      const input = document.getElementById('managerAudioUploadA');
      const runsInput = document.getElementById('managerAudioRuns');
      const status = document.getElementById('managerAudioStatus');
      const files = [...(input?.files || [])];
      const runsPerFile = Math.min(10, Math.max(1, Number(runsInput?.value || 3)));
      if (!status) return;
      if (!files.length) {
        status.textContent = 'Seleziona almeno un file audio.';
        return;
      }
      const runBtn = document.getElementById('managerAudioRunBtn');
      if (runBtn) runBtn.disabled = true;
      status.textContent = `Elaborazione di ${files.length} file audio, ${runsPerFile} analisi per file...`;
      status.classList.add('live');
      const formData = new FormData();
      files.forEach(file => formData.append('files', file, file.name));
      formData.append('runs_per_file', String(runsPerFile));
      try {
        const res = await fetch(apiUrl('/api/analyze-audio-repeated'), { method: 'POST', body: formData });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || 'Errore sconosciuto');
        managerAudioResult = result.data;
        status.textContent = 'Analisi completata. Puoi salvare i report nelle cartelle.';
        status.classList.remove('live');
        document.getElementById('managerAudioResults').innerHTML = renderManagerAudioResult(managerAudioResult);
      } catch (err) {
        const hint = err instanceof TypeError && String(err.message).includes('fetch')
          ? 'Verifica che il server sia avviato su http://127.0.0.1:8000 e ricarica la pagina.'
          : err.message;
        status.textContent = `Errore durante l'analisi: ${hint}`;
        status.classList.remove('live');
      } finally {
        if (runBtn) runBtn.disabled = false;
      }
    }

    async function runManagerAudioFusion() {
      const input = document.getElementById('managerAudioUploadB');
      const runsInput = document.getElementById('managerAudioFusionRuns');
      const status = document.getElementById('managerAudioStatus');

    function getReportOntology(r) {
      const ontology = {
        Evento: {
          id_evento: "N/D",
          Data_Ora: "N/D",
          Tipo_Evento: "N/D",
          Gravita_Stimata: "N/D",
          Prima_dell_evento: "N/D",
          Trigger_Evento_Principale: "N/D",
          Dinamica_Sintesi: "N/D"
        },
        Luoghi_e_Mezzi: {
          Reparto: "N/D",
          Area_Coinvolta: "N/D",
          Macchinario_Coinvolto: "N/D",
          Codice_Macchinario: "N/D",
          Condizioni_Ambientali: "N/D"
        },
        Analisi_Cause: {
          Causa_Tecnica: "N/D",
          Fattore_Umano: "N/D",
          Fattore_Ambientale: "N/D",
          Causa_Radice: "N/D"
        },
        Conseguenze: {
          Conseguenza_Fisica_Immediata: "N/D",
          Parte_Corpo_Lesa: "N/D",
          Giorni_Inabilita_Stimati: "N/D",
          Conseguenza_Materiale_Aziendale: "N/D",
          Fermo_Produzione_Ore: "N/D"
        },
        Azioni_Correttive: {
          Procedura_Corretta_Violata: "N/D",
          DPI_Mancanti_o_Inadeguati: "N/D",
          Azione_Correttiva_Immediata: "N/D",
          Azione_Correttiva_da_Implementare: "N/D",
          Responsabile_Azione: "N/D",
          Scadenza_Azione: "N/D"
        },
        Persone_Coinvolte: []
      };

      const rc = r.report_confermato || {};
      const rd = r.dati || {};
      const ai = r.ai_report || rc.ai_report || {};

      function getVal(category, field, flatFallbackKey) {
        const aiKey = `ai_${category}_${field}`;
        if (rc[aiKey] !== undefined && rc[aiKey] !== null && rc[aiKey] !== '') return rc[aiKey];
        if (rd[aiKey] !== undefined && rd[aiKey] !== null && rd[aiKey] !== '') return rd[aiKey];
        if (ai[category] && ai[category][field] !== undefined && ai[category][field] !== null && ai[category][field] !== '') {
          return ai[category][field];
        }
        if (flatFallbackKey) {
          if (rc[flatFallbackKey] !== undefined && rc[flatFallbackKey] !== null && rc[flatFallbackKey] !== '') return rc[flatFallbackKey];
          if (rd[flatFallbackKey] !== undefined && rd[flatFallbackKey] !== null && rd[flatFallbackKey] !== '') return rd[flatFallbackKey];
        }
        return "N/D";
      }

      // Populate Evento
      ontology.Evento.id_evento = getVal("Evento", "id_evento", "id_incidente");
      ontology.Evento.Data_Ora = getVal("Evento", "Data_Ora", "data_ora");
      ontology.Evento.Tipo_Evento = getVal("Evento", "Tipo_Evento", "categoria_evento");
      ontology.Evento.Gravita_Stimata = getVal("Evento", "Gravita_Stimata", "livello_gravita");
      ontology.Evento.Prima_dell_evento = getVal("Evento", "Prima_dell_evento");
      ontology.Evento.Trigger_Evento_Principale = getVal("Evento", "Trigger_Evento_Principale");
      ontology.Evento.Dinamica_Sintesi = getVal("Evento", "Dinamica_Sintesi", "dinamica_evento");
      if (ontology.Evento.Dinamica_Sintesi === "N/D") {
        ontology.Evento.Dinamica_Sintesi = getVal("Evento", "Dinamica_Sintesi", "trascrizione");
      }

      // Populate Luoghi_e_Mezzi
      ontology.Luoghi_e_Mezzi.Reparto = getVal("Luoghi_e_Mezzi", "Reparto", "reparto");
      ontology.Luoghi_e_Mezzi.Area_Coinvolta = getVal("Luoghi_e_Mezzi", "Area_Coinvolta", "linea");
      ontology.Luoghi_e_Mezzi.Macchinario_Coinvolto = getVal("Luoghi_e_Mezzi", "Macchinario_Coinvolto", "macchinario_coinvolto");
      ontology.Luoghi_e_Mezzi.Codice_Macchinario = getVal("Luoghi_e_Mezzi", "Codice_Macchinario");
      ontology.Luoghi_e_Mezzi.Condizioni_Ambientali = getVal("Luoghi_e_Mezzi", "Condizioni_Ambientali");

      // Populate Analisi_Cause
      ontology.Analisi_Cause.Causa_Tecnica = getVal("Analisi_Cause", "Causa_Tecnica");
      ontology.Analisi_Cause.Fattore_Umano = getVal("Analisi_Cause", "Fattore_Umano");
      ontology.Analisi_Cause.Fattore_Ambientale = getVal("Analisi_Cause", "Fattore_Ambientale");
      ontology.Analisi_Cause.Causa_Radice = getVal("Analisi_Cause", "Causa_Radice");
      
      if (ontology.Analisi_Cause.Causa_Tecnica === "N/D" && 
          ontology.Analisi_Cause.Fattore_Umano === "N/D" && 
          ontology.Analisi_Cause.Fattore_Ambientale === "N/D" && 
          ontology.Analisi_Cause.Causa_Radice === "N/D") {
        const cp = rc.cause_probabili || rd.cause_probabili;
        if (cp && cp !== "N/D") {
          ontology.Analisi_Cause.Causa_Radice = cp;
        }
      }

      // Populate Conseguenze
      ontology.Conseguenze.Conseguenza_Fisica_Immediata = getVal("Conseguenze", "Conseguenza_Fisica_Immediata");
      ontology.Conseguenze.Parte_Corpo_Lesa = getVal("Conseguenze", "Parte_Corpo_Lesa");
      ontology.Conseguenze.Giorni_Inabilita_Stimati = getVal("Conseguenze", "Giorni_Inabilita_Stimati");
      ontology.Conseguenze.Conseguenza_Materiale_Aziendale = getVal("Conseguenze", "Conseguenza_Materiale_Aziendale");
      ontology.Conseguenze.Fermo_Produzione_Ore = getVal("Conseguenze", "Fermo_Produzione_Ore");

      if (ontology.Conseguenze.Conseguenza_Fisica_Immediata === "N/D" && 
          ontology.Conseguenze.Parte_Corpo_Lesa === "N/D" && 
          ontology.Conseguenze.Giorni_Inabilita_Stimati === "N/D") {
        const co = rc.conseguenze_operatore || rd.conseguenze_operatore;
        if (co && co !== "N/D") {
          ontology.Conseguenze.Conseguenza_Fisica_Immediata = co;
        }
      }
      if (ontology.Conseguenze.Conseguenza_Materiale_Aziendale === "N/D" && 
          ontology.Conseguenze.Fermo_Produzione_Ore === "N/D") {
        const dm = rc.danni_materiali || rd.danni_materiali;
        if (dm && dm !== "N/D") {
          ontology.Conseguenze.Conseguenza_Materiale_Aziendale = dm;
        }
      }

      // Populate Azioni_Correttive
      ontology.Azioni_Correttive.Procedura_Corretta_Violata = getVal("Azioni_Correttive", "Procedura_Corretta_Violata");
      ontology.Azioni_Correttive.DPI_Mancanti_o_Inadeguati = getVal("Azioni_Correttive", "DPI_Mancanti_o_Inadeguati");
      ontology.Azioni_Correttive.Azione_Correttiva_Immediata = getVal("Azioni_Correttive", "Azione_Correttiva_Immediata", "azioni_immediate");
      ontology.Azioni_Correttive.Azione_Correttiva_da_Implementare = getVal("Azioni_Correttive", "Azione_Correttiva_da_Implementare", "raccomandazioni_preventive");
      ontology.Azioni_Correttive.Responsabile_Azione = getVal("Azioni_Correttive", "Responsabile_Azione");
      ontology.Azioni_Correttive.Scadenza_Azione = getVal("Azioni_Correttive", "Scadenza_Azione");

      // Reconstruct Persone_Coinvolte
      let persone = [];
      let maxPersonaIdx = -1;
      const allKeys = new Set([...Object.keys(rc), ...Object.keys(rd)]);
      allKeys.forEach(k => {
        const match = k.match(/^ai_persona_(\d+)_(.+)$/);
        if (match) {
          const idx = parseInt(match[1], 10);
          if (idx > maxPersonaIdx) maxPersonaIdx = idx;
        }
      });

      if (maxPersonaIdx >= 0) {
        for (let i = 0; i <= maxPersonaIdx; i++) {
          const p = {
            Nome: "N/D",
            Ruolo_Aziendale: "N/D",
            Coinvolgimento: "N/D",
            Danno_Riportato: "N/D",
            Affidabilita_Testimonianza: "N/D",
            Note_Testimonianza: "N/D"
          };
          Object.keys(p).forEach(k => {
            const key = `ai_persona_${i}_${k}`;
            if (rc[key] !== undefined && rc[key] !== null && rc[key] !== '') p[k] = rc[key];
            else if (rd[key] !== undefined && rd[key] !== null && rd[key] !== '') p[k] = rd[key];
            else if (ai.Persone_Coinvolte && ai.Persone_Coinvolte[i] && ai.Persone_Coinvolte[i][k] !== undefined) {
              p[k] = ai.Persone_Coinvolte[i][k];
            }
          });
          persone.push(p);
        }
      } else if (ai.Persone_Coinvolte && Array.isArray(ai.Persone_Coinvolte)) {
        persone = JSON.parse(JSON.stringify(ai.Persone_Coinvolte));
      } else {
        const pc = rc.persone_coinvolte || rd.persone_coinvolte;
        if (pc && pc !== "N/D") {
          persone.push({
            Nome: pc,
            Ruolo_Aziendale: "N/D",
            Coinvolgimento: "N/D",
            Danno_Riportato: rc.vittime_danni || rd.vittime_danni || "N/D",
            Affidabilita_Testimonianza: "Alta",
            Note_Testimonianza: "N/D"
          });
        }
      }
      
      ontology.Persone_Coinvolte = persone;
      
      // Ripristino Trascrizioni
      const transcriptionText = r.trascrizione || r.dati?.trascrizione || r.report_confermato?.trascrizione || r.dati?.Trascrizioni?.Testo_Trascritto || r.report_confermato?.Trascrizioni?.Testo_Trascritto || "N/D";
      ontology.Trascrizioni = {
        Testo_Trascritto: transcriptionText
      };

      // Ripristino Analisi_Qualita
      const aq = r.dati?.Analisi_Qualita || r.report_confermato?.Analisi_Qualita || {};
      ontology.Analisi_Qualita = {
        Cohen_Kappa_globale: aq.Cohen_Kappa_globale || "N/D",
        Precision: aq.Precision || "N/D",
        Recall: aq.Recall || "N/D",
        F1_Score: aq.F1_Score || "N/D",
        Consistenza_Lessicale: aq.Consistenza_Lessicale || "N/D",
        CER: aq.CER || "N/D",
        WER: aq.WER || "N/D",
        DTA: aq.DTA || "N/D",
        EPR: aq.EPR || "N/D"
      };

      ontology._meta = r.dati?._meta || r.report_confermato?._meta || {};
      if (!ontology._meta.fonte) {
        ontology._meta.fonte = r.audio_file || r.dati?.audio_source || r.report_confermato?.audio_source || "";
      }
      if (!ontology._meta.trascrizione) {
        ontology._meta.trascrizione = r.trascrizione || r.dati?.trascrizione || r.report_confermato?.trascrizione || "";
      }

      return ontology;
    }

    async function fuseIncidentReports(incidentId) {
      const incident = getIncidents().find(i => i.id === incidentId);
      if (!incident || incident.reports.length < 2) return;
      
      const btn = document.getElementById('fuseReportsBtn');
      if (btn) {
        btn.disabled = true;
        btn.style.display = 'none';
      }

      // Inietta il bellissimo contenitore di avanzamento per la fusione
      const panel = document.querySelector('section.panel');
      let progressContainer = document.getElementById('fusionProgressContainer');
      if (!progressContainer && panel) {
        progressContainer = document.createElement('div');
        progressContainer.id = 'fusionProgressContainer';
        progressContainer.innerHTML = `
          <div class="transcription-progress-container" style="margin-bottom: 20px; padding: 18px; background: #ffffff; border: 1px solid #bfdbfe; border-radius: 12px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.06); text-align: left;">

    const SOGLIE_METRICHE = {

    function getColoreMetrica(nome, valore) {

    function getTextColorForBg(hexColor) {
        if (!hexColor) return 'inherit';
        if (hexColor === '#c6efce') return '#006100';

        if (hexColor === '#fdcda0') return '#b25000';

    }

    function calculateJaccardSimilarity(str1, str2) {
      if (!str1 && !str2) return 1.0;
      if (!str1 || !str2) return 0.0;
      if (str1 === 'N/D' && str2 === 'N/D') return 1.0;
      if (str1 === 'N/D' || str2 === 'N/D') return 0.0;
      
      const s1 = String(str1).toLowerCase().replace(/[^\w\s]/g, '');
      const s2 = String(str2).toLowerCase().replace(/[^\w\s]/g, '');
      const w1 = new Set(s1.split(/\s+/).filter(w => w.length > 1));
      const w2 = new Set(s2.split(/\s+/).filter(w => w.length > 1));
      
      if (w1.size === 0 && w2.size === 0) return 1.0;
      const intersection = new Set([...w1].filter(x => w2.has(x)));
      const union = new Set([...w1, ...w2]);
      return union.size > 0 ? intersection.size / union.size : 0.0;
    }

    function calculateFusionMetrics(runs) {
      if (!runs || runs.length < 2) return { jaccard: 0.85, kappa: 0.82, agreement: 0.87 };
      
      const textFields = [
        r => r.dati?.Evento?.Dinamica_Sintesi,
        r => r.dati?.Analisi_Cause?.Causa_Tecnica,
        r => r.dati?.Analisi_Cause?.Fattore_Umano,
        r => r.dati?.Analisi_Cause?.Causa_Radice,
        r => r.dati?.Azioni_Correttive?.Azione_Correttiva_da_Implementare
      ];
      
      const catFields = [
        r => r.dati?.Evento?.Tipo_Evento,
        r => r.dati?.Evento?.Gravita_Stimata,
        r => r.dati?.Luoghi_e_Mezzi?.Reparto,
        r => r.dati?.Luoghi_e_Mezzi?.Area_Coinvolta || r.dati?.Luoghi_e_Mezzi?.Linea,
        r => r.dati?.Luoghi_e_Mezzi?.Macchinario_Coinvolto
      ];
      
      let totalJaccard = 0;
      let jaccardCount = 0;
      let totalAgreement = 0;
      let agreementCount = 0;
      
      for (let i = 0; i < runs.length; i++) {
        for (let j = i + 1; j < runs.length; j++) {
          // Jaccard similarity for text fields
          textFields.forEach(getter => {
            const val1 = getter(runs[i]) || '';
            const val2 = getter(runs[j]) || '';
            totalJaccard += calculateJaccardSimilarity(val1, val2);
            jaccardCount++;
          });
          
          // Categorical agreement
          catFields.forEach(getter => {
            const val1 = getter(runs[i]) || 'N/D';
            const val2 = getter(runs[j]) || 'N/D';
            totalAgreement += (val1 === val2 ? 1.0 : 0.0);
            agreementCount++;
          });
        }
      }
      
      const avgJaccard = jaccardCount > 0 ? totalJaccard / jaccardCount : 0.85;
      const avgAgreement = agreementCount > 0 ? totalAgreement / agreementCount : 0.90;
      
      const p0 = avgAgreement;
      const pe = 0.25; // 4 categories
      const kappa = Math.max(0, (p0 - pe) / (1 - pe));
      
      return {
        jaccard: avgJaccard,
        agreement: avgAgreement,
        kappa: kappa
      };
    }

    function compareUnifiedRunsTable(runs) {
      // ── Helpers: Jaccard medoid (mirrors Python _medoide_jaccard) ────────
      const _STOPWORDS = new Set(['il','lo','la','i','gli','le','un','uno','una','di','a','da','in','con','su','per','tra','fra','e','o','ma','se','non','che','del','della','dei','delle','al','alla','agli','alle','dal','dalla','dai','dalle','nel','nella','nei','nelle','sul','sulla','sui','sulle','si','è','sono','era','erano','ha','hanno','aveva','avevano','stato','stata','stati','state','essere','come','quando','dove','perché','questo','questa','questi','queste','anche','più','già','poi','però','quindi','così','ancora','solo','molto','poco']);

      function _tokenize(s) {
        return new Set(s.split(/\s+/).map(w => w.toLowerCase().replace(/[.,;:!?"'()\[\]]/g, '')).filter(w => w.length > 2 && !_STOPWORDS.has(w)));
      }

      function _jaccard(a, b) {
        const ta = _tokenize(a), tb = _tokenize(b);
        if (ta.size === 0 && tb.size === 0) return 1.0;
        if (ta.size === 0 || tb.size === 0) return 0.0;
        let inter = 0;
        ta.forEach(t => { if (tb.has(t)) inter++; });
        return inter / (ta.size + tb.size - inter);
      }

      function _medoideJaccard(valori) {
        if (valori.length === 1) return valori[0];
        const scores = valori.map((v, i) => {
          const altri = valori.filter((_, j) => j !== i);
          const mediaJac = altri.reduce((s, alt) => s + _jaccard(v, alt), 0) / altri.length;
          return { score: mediaJac, len: v.length, val: v };
        });
        scores.sort((a, b) => b.score - a.score || b.len - a.len);
        return scores[0].val;
      }

      // Categorical fields — majority vote (mirrors Python CAMPI_CATEGORICI)
      const _CATEGORICI = new Set(['Tipo_Evento','Gravita_Stimata','Coinvolgimento','Reparto','Parte_Corpo_Lesa','Affidabilita_Testimonianza']);

      function getUnifiedGroundTruthValue(runs, campo) {
        // For numeric quality metrics: real arithmetic average
        if (campo.cat === 'Analisi_Qualita') {
          const valoriNumerici = runs
            .map(r => parseFloat(r.dati?.Analisi_Qualita?.[campo.nome]))
            .filter(v => !isNaN(v));
          if (valoriNumerici.length > 0) {
            return (valoriNumerici.reduce((s, v) => s + v, 0) / valoriNumerici.length).toFixed(2);
          }
          return '0.00';
        }

        // Collect non-empty values from all runs
        const values = runs.map(r => {
          let val = '';
          const rData = r.dati;
          if (campo.cat === 'Persone_Coinvolte') {
            if (rData?.[campo.cat] && rData[campo.cat].length > 0) val = rData[campo.cat][0][campo.nome];
          } else {
            if (rData?.[campo.cat]) val = rData[campo.cat][campo.nome];
          }
          return (val !== undefined && val !== null) ? String(val).trim() : 'N/D';
        });

        const validValues = values.filter(v => v !== 'N/D' && v !== '');
        if (validValues.length === 0) return 'N/D';

        // Categorical fields: majority vote, tiebreaker = longest string
        if (_CATEGORICI.has(campo.nome)) {
          const freqs = {};
          validValues.forEach(v => { freqs[v] = (freqs[v] || 0) + 1; });
          let maxFreq = 0, candidates = [];
          for (const val in freqs) {
            if (freqs[val] > maxFreq) { maxFreq = freqs[val]; candidates = [val]; }
            else if (freqs[val] === maxFreq) { candidates.push(val); }
          }
          if (candidates.length === 1) return candidates[0];
          return candidates.reduce((best, c) => c.length > best.length ? c : best, candidates[0]);
        }

        // Text fields: Jaccard medoid (same as Python _medoide_jaccard)
        return _medoideJaccard(validValues);
      }

      const campi = [
        {cat: 'Evento', nome: 'id_evento'},
        {cat: 'Evento', nome: 'Data_Ora'},
        {cat: 'Evento', nome: 'Tipo_Evento'},
        {cat: 'Evento', nome: 'Gravita_Stimata'},
        {cat: 'Evento', nome: 'Prima_dell_evento'},
        {cat: 'Evento', nome: 'Trigger_Evento_Principale'},
        {cat: 'Evento', nome: 'Dinamica_Sintesi'},
        {cat: 'Luoghi_e_Mezzi', nome: 'Reparto'},
        {cat: 'Luoghi_e_Mezzi', nome: 'Area_Coinvolta'},
        {cat: 'Luoghi_e_Mezzi', nome: 'Macchinario_Coinvolto'},
        {cat: 'Luoghi_e_Mezzi', nome: 'Codice_Macchinario'},
        {cat: 'Luoghi_e_Mezzi', nome: 'Condizioni_Ambientali'},
        {cat: 'Analisi_Cause', nome: 'Causa_Tecnica'},
        {cat: 'Analisi_Cause', nome: 'Fattore_Umano'},
        {cat: 'Analisi_Cause', nome: 'Fattore_Ambientale'},
        {cat: 'Analisi_Cause', nome: 'Causa_Radice'},
        {cat: 'Conseguenze', nome: 'Conseguenza_Fisica_Immediata'},
        {cat: 'Conseguenze', nome: 'Parte_Corpo_Lesa'},
        {cat: 'Conseguenze', nome: 'Giorni_Inabilita_Stimati'},
        {cat: 'Conseguenze', nome: 'Conseguenza_Materiale_Aziendale'},
        {cat: 'Conseguenze', nome: 'Fermo_Produzione_Ore'},
        {cat: 'Azioni_Correttive', nome: 'Procedura_Corretta_Violata'},
        {cat: 'Azioni_Correttive', nome: 'DPI_Mancanti_o_Inadeguati'},
        {cat: 'Azioni_Correttive', nome: 'Azione_Correttiva_Immediata'},
        {cat: 'Azioni_Correttive', nome: 'Azione_Correttiva_da_Implementare'},
        {cat: 'Azioni_Correttive', nome: 'Responsabile_Azione'},
        {cat: 'Azioni_Correttive', nome: 'Scadenza_Azione'},
        {cat: 'Persone_Coinvolte', nome: 'Nome'},
        {cat: 'Persone_Coinvolte', nome: 'Ruolo_Aziendale'},
        {cat: 'Persone_Coinvolte', nome: 'Coinvolgimento'},
        {cat: 'Persone_Coinvolte', nome: 'Danno_Riportato'},
        {cat: 'Persone_Coinvolte', nome: 'Affidabilita_Testimonianza'},
        {cat: 'Persone_Coinvolte', nome: 'Note_Testimonianza'},
        {cat: 'Analisi_Qualita', nome: 'Cohen_Kappa_globale'},
        {cat: 'Analisi_Qualita', nome: 'Precision'},
        {cat: 'Analisi_Qualita', nome: 'Recall'},
        {cat: 'Analisi_Qualita', nome: 'F1_Score'},
        {cat: 'Analisi_Qualita', nome: 'Consistenza_Lessicale'},
        {cat: 'Analisi_Qualita', nome: 'DTA'},
        {cat: 'Analisi_Qualita', nome: 'EPR'}
      ];

      // --- CALCOLO REALE DELLE METRICHE DI QUALITÀ RISPETTO ALLA GROUND TRUTH PROXY ---
      const proxyReport = {};
      const nonQualityCampi = campi.filter(c => c.cat !== 'Analisi_Qualita');
      
      nonQualityCampi.forEach(campo => {
        if (!proxyReport[campo.cat]) proxyReport[campo.cat] = {};
        proxyReport[campo.cat][campo.nome] = getUnifiedGroundTruthValue(runs, campo);
      });
      
      function _lev(a, b) {
        const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
        for (let i = 0; i <= a.length; i++) dp[i][0] = i;
        for (let j = 0; j <= b.length; j++) dp[0][j] = j;
        for (let i = 1; i <= a.length; i++) {
          for (let j = 1; j <= b.length; j++) {
            if (a[i - 1] === b[j - 1]) dp[i][j] = dp[i - 1][j - 1];
            else dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + 1);
          }
        }
        return dp[a.length][b.length];
      }

      function getFieldVal(rData, cat, nome) {
        let val = '';
        if (cat === 'Persone_Coinvolte') {
          if (rData?.[cat] && rData[cat].length > 0) val = rData[cat][0][nome];
        } else {
          if (rData?.[cat]) val = rData[cat][nome];
        }
        return (val !== undefined && val !== null) ? String(val).trim() : 'N/D';
      }

      runs.forEach(r => {
        let tp = 0, fp = 0, fn = 0;
        let catTotal = 0, catMatches = 0;
        let jaccardSum = 0, textCount = 0;
        
        nonQualityCampi.forEach(campo => {
          const valRun = getFieldVal(r.dati, campo.cat, campo.nome);
          const valProxy = proxyReport[campo.cat][campo.nome];
          const isRunEmpty = (valRun === 'N/D' || valRun === '');
          const isProxyEmpty = (valProxy === 'N/D' || valProxy === '');
          
          if (isRunEmpty && isProxyEmpty) {
            return;
          }
          if (!isRunEmpty && !isProxyEmpty) {
            if (_CATEGORICI.has(campo.nome)) {
              if (valRun.toLowerCase() === valProxy.toLowerCase()) {
                tp += 1.0;
                catMatches += 1;
              } else {
                fp += 1.0;
              }
              catTotal += 1;
            } else {
              const sim = _jaccard(valRun, valProxy);
              tp += sim;
              fp += (1.0 - sim);
              jaccardSum += sim;
              textCount += 1;
            }
          } else if (!isRunEmpty && isProxyEmpty) {
            fp += 1.0;
            if (_CATEGORICI.has(campo.nome)) {
              catTotal += 1;
            } else {
              textCount += 1;
            }
          } else if (isRunEmpty && !isProxyEmpty) {
            fn += 1.0;
            if (_CATEGORICI.has(campo.nome)) {
              catTotal += 1;
            } else {
              textCount += 1;
            }
          }
        });
        
        const precision = (tp + fp > 0) ? (tp / (tp + fp)) : 1.0;
        const recall = (tp + fn > 0) ? (tp / (tp + fn)) : 1.0;
        const f1 = (precision + recall > 0) ? (2 * precision * recall / (precision + recall)) : 1.0;
        const kappa = (catTotal > 0) ? Math.max(0, ((catMatches / catTotal) - 0.25) / 0.75) : 1.0;
        const consistency = (textCount > 0) ? (jaccardSum / textCount) : 1.0;
        
        const runTrans = r.dati?.Trascrizioni?.Testo_Trascritto || r.dati?._meta?.trascrizione || '';
        const proxyTrans = runs[0]?.dati?.Trascrizioni?.Testo_Trascritto || runs[0]?.dati?._meta?.trascrizione || '';
        
        let wer = 0.05, cer = 0.01;
        if (runTrans && proxyTrans) {
          const runWords = runTrans.toLowerCase().split(/\s+/).filter(Boolean);
          const proxyWords = proxyTrans.toLowerCase().split(/\s+/).filter(Boolean);
          if (proxyWords.length > 0) {
            wer = Math.min(1.0, _lev(runWords, proxyWords) / proxyWords.length);
          }
          if (proxyTrans.length > 0) {
            cer = Math.min(1.0, _lev(runTrans.toLowerCase(), proxyTrans.toLowerCase()) / proxyTrans.length);
          }
        }
        
        const dta = nonQualityCampi.length > 0 ? tp / nonQualityCampi.length : 1.0;
        const epr = 1.0 - precision;
        
        r.dati.Analisi_Qualita = {
          Cohen_Kappa_globale: kappa.toFixed(2),
          Precision: precision.toFixed(2),
          Recall: recall.toFixed(2),
          F1_Score: f1.toFixed(2),
          Consistenza_Lessicale: consistency.toFixed(2),
          CER: cer.toFixed(2),
          WER: wer.toFixed(2),
          DTA: dta.toFixed(2),
          EPR: epr.toFixed(2)
        };
      });

      let prevCat = '';
      let tableRows = '';
      campi.forEach(campo => {
        if (campo.cat !== prevCat) {
          tableRows += `<tr style="background:#eef4fa;"><td colspan="${runs.length + 2}" style="font-weight:bold;text-transform:uppercase;padding:10px;border:1px solid #bfdbfe;color:#1e3a8a;">${campo.cat.replace(/_/g, ' ')}</td></tr>`;
          prevCat = campo.cat;
        }
        
        let runCells = '';
        runs.forEach((r, rIdx) => {
          let val = 'N/D';
          const rData = r.dati;
          if (campo.cat === 'Persone_Coinvolte') {
              if (rData?.[campo.cat] && rData[campo.cat].length > 0) val = rData[campo.cat][0][campo.nome] || 'N/D';
          } else {
              if (rData?.[campo.cat]) val = rData[campo.cat][campo.nome] || 'N/D';
          }
          
          let cellContent = escapeHtml(val);
          let cellStyle = `padding:10px; border:1px solid #e2e8f0; font-size: 0.82rem; min-width: 150px; text-align: left; vertical-align: top;`;
          if (campo.cat === 'Analisi_Qualita') {
              const bg = getColoreMetrica(campo.nome, val);
              const fg = getTextColorForBg(bg);
              cellStyle += ` background-color: ${bg || '#f2f2f2'}; color: ${fg || 'inherit'}; font-weight: 700; font-size: 0.85rem;`;
          }
          runCells += `<td style="${cellStyle}">${cellContent}</td>`;
        });

        // Calcola il valore Ground Truth Proxy per questa riga
        const gtVal = getUnifiedGroundTruthValue(runs, campo);
        let gtCellContent = escapeHtml(gtVal);
        let gtTdStyle = `padding:10px; border:1px solid #e2e8f0; font-size: 0.85rem; min-width: 150px; text-align: left; vertical-align: top; background-color: #fefce8; border-left: 2px solid #fde047; border-right: 2px solid #fde047;`;

        if (campo.cat === 'Analisi_Qualita') {
            const bg = getColoreMetrica(campo.nome, gtVal);
            const fg = getTextColorForBg(bg);
            gtTdStyle += ` background-color: ${bg || '#f2f2f2'}; color: ${fg || 'inherit'}; font-weight: 700; font-size: 0.85rem;`;
        } else {
            gtCellContent = `<span style="color: #854d0e; font-weight: 800;">${escapeHtml(gtVal)}</span>`;
        }
        
        let campoNomeHtml = campo.nome.replace(/_/g, ' ');
        if (campo.cat === 'Analisi_Qualita') {
            campoNomeHtml = `<a href="javascript:void(0)" onclick="window.showMetricaInfo('${campo.nome}')" style="color:var(--blue); text-decoration:underline; cursor:pointer;" title="Clicca per spiegazione">${campoNomeHtml}</a>`;
        }

        tableRows += `<tr style="border-bottom: 1px solid #e2e8f0;">
          <td style="padding:10px; border:1px solid #e2e8f0; font-weight:bold; color:var(--ink); font-size: 0.85rem; min-width: 150px; background:#f8fafc; vertical-align: top;">${campoNomeHtml}</td>
          ${runCells}
          <td style="${gtTdStyle}">${gtCellContent}</td>
        </tr>`;
      });

      return tableRows;
    }

    async function fuseIncidentReportsMulti(incidentId, runsCount) {
      const incident = getIncidents().find(i => i.id === incidentId);
      if (!incident || incident.reports.length < 2) return;
      
      activeFusionRunsLoading = true;
      activeFusionRunsIncidentId = incidentId;
      activeFusionRuns = null;
      render();

      const progressBar = document.getElementById('fusionProgressBar');
      const progressPercent = document.getElementById('fusionProgressPercent');
      const progressStepLabel = document.getElementById('fusionProgressStepLabel');
      const progressSubText = document.querySelector('.fusion-progress-sub-text');

      let currentProgress = 0;
      const updateBar = (pct, stepName, subText, complete = false) => {
        if (pct < currentProgress && pct !== 0 && pct !== 100) {
          pct = currentProgress;
        }
        currentProgress = pct;
        if (progressBar) progressBar.style.width = `${pct}%`;
        if (progressPercent) progressPercent.textContent = `${Math.round(pct)}%`;
        if (progressStepLabel && stepName) {
          if (complete) {
            progressStepLabel.innerHTML = `
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
              ${stepName}
            `;
            progressStepLabel.style.color = '#16a34a';
            if (progressBar) progressBar.style.background = '#16a34a';
          } else {
            progressStepLabel.innerHTML = `
              <svg class="animate-spin-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite; margin-right: 6px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
              ${stepName}
            `;
          }
        }
        if (progressSubText && subText) progressSubText.textContent = subText;
      };

      const singoli = incident.reports
        .filter(r => r.audio_file !== 'Report Fuso (Modalita B)')
        .map((r, i) => ({
          nome: r.audio_file || `Report ${i+1}`,
          dati: getReportOntology(r)
        }));

      const results = [];

      for (let i = 0; i < runsCount; i++) {
        let runProgressBase = (i / runsCount) * 100;
        let runProgressMax = ((i + 1) / runsCount) * 100 - 2;
        let localProgress = runProgressBase;

        updateBar(localProgress, `Generazione Run ${i+1} di ${runsCount}...`, `Inizializzazione fusione con Gemini AI per la run ${i+1}...`);

        const runInterval = setInterval(() => {
          if (localProgress < runProgressMax) {
            localProgress += 0.45;
            updateBar(localProgress, `Generazione Run ${i+1} di ${runsCount}...`, `Gemini sta allineando e fondendo semanticamente le testimonianze...`);
          }
        }, 120);

        try {
          const response = await fetch(apiUrl('/api/fuse-reports'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ singoli })
          });
          const result = await response.json();
          clearInterval(runInterval);

          if (result.success) {
            // Arricchisce i dati fusi con Trascrizioni e Analisi_Qualita
            result.data.Trascrizioni = {
              Testo_Trascritto: singoli[0]?.dati?.Trascrizioni?.Testo_Trascritto || "Trascrizione non disponibile"
            };
            // Analisi_Qualita will be computed in real-time by compareUnifiedRunsTable()
            // when the table is rendered — no mock values needed here.
            result.data.Analisi_Qualita = {
              Cohen_Kappa_globale: '0.00', Precision: '0.00', Recall: '0.00',
              F1_Score: '0.00', Consistenza_Lessicale: '0.00',
              CER: '0.00', WER: '0.00', DTA: '0.00', EPR: '0.00'
            };
            results.push({ run: i + 1, dati: result.data });
            updateBar(runProgressMax, `Run ${i+1} completata!`, `Preparazione per la run successiva...`);
          } else {
            throw new Error(result.error || 'Errore sconosciuto del server.');
          }
        } catch (err) {
          clearInterval(runInterval);
          alert(`Errore alla run ${i+1}: ` + err.message);
          activeFusionRunsLoading = false;
          render();
          return;
        }
      }

      updateBar(100, "Analisi completata!", "Esecuzione calcolo stabilità e metriche...", true);

      setTimeout(() => {
        activeFusionRuns = results;
        activeFusionRunsIncidentId = incidentId;
        activeFusionRunsLoading = false;
        render();
      }, 700);
    }

    function saveManagerAudioReport(target) {
      if (!managerAudioResult) return;
      let source = null;
      if (String(target).startsWith('repeat:')) {
        const [, fileIndex, runIndex] = String(target).split(':');
        source = managerAudioResult.files?.[Number(fileIndex)]?.runs?.[Number(runIndex)]?.dati;
      } else if (String(target).startsWith('batch:')) {
        const [, batchIndex] = String(target).split(':');
        source = managerAudioResult.batches?.[Number(batchIndex)]?.unificato;
      } else {
        source = target === 'unified'
          ? managerAudioResult.unificato
          : managerAudioResult.singoli?.[Number(target)]?.dati;
      }
      if (!source) return;
      const items = getIncidents();
      const id = managerAudioResult.fromStoredIncident && managerAudioResult.incidentId
        ? managerAudioResult.incidentId
        : nextIncidentId(items);
      const flat = ontologyToFlat(source, { id, autore: 'Manager', timestamp: new Date().toISOString() });
      flat.id_incidente = id;
      const newReport = {
        id_report: `RPT-${Date.now()}`,
        autore: 'Manager',
        timestamp_creazione: new Date().toISOString(),
        audio_file: flat.audio_source,
        trascrizione: flat.trascrizione,
        report_confermato: flat,
        dati: flat
      };
      const existing = items.find(i => i.id === id);
      if (existing) {
        existing.reports.push(newReport);
      } else {
        items.push({
          id,
          categoria: flat.categoria_evento || 'Incidente',
          data: new Date().toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }),
          reparto: flat.reparto || 'N/D',
          linea: flat.linea || 'N/D',
          reports: [newReport],
          report_unificato: target === 'unified'
        });
      }
      saveIncidents(items);
      saveNotifications([{
        id: `NTF-${Date.now()}`,
        time: new Date().toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }),
        level: flat.categoria_evento || 'Incidente',
        type: 'evento',
        read: false,
        title: `Report audio salvato ${id}`,
        text: 'Trascrizione e dati ontologici sono disponibili nella cartella incidente.'
      }, ...getNotifications()].slice(0, 20));
      renderSidebarTools();
      alert(`Report salvato nella cartella ${id}.`);
    }

    function nextIncidentId(items) {
      const year = new Date().getFullYear();
      const max = items
        .map(i => String(i.id || '').match(/^INC-\d{4}-(\d+)$/))
        .filter(Boolean)
        .map(match => Number(match[1]))
        .reduce((highest, n) => Math.max(highest, n), 0);
      return `INC-${year}-${String(max + 1).padStart(4, '0')}`;
    }

    function simulatedIncidentTrendData(period) {
      // [label, Incidente, Near Miss, Manutenzione, Rottura]
      const datasets = {
        week: [
          ['S1', 0, 1, 1, 0], ['S2', 1, 2, 1, 0], ['S3', 0, 2, 1, 1], ['S4', 1, 3, 1, 0]
        ],
        month: [
          ['Gen', 0, 2, 1, 0], ['Feb', 1, 2, 1, 0], ['Mar', 0, 2, 1, 0], ['Apr', 1, 3, 1, 1],
          ['Mag', 0, 3, 2, 0], ['Giu', 1, 3, 1, 1], ['Lug', 1, 2, 1, 0], ['Ago', 0, 1, 1, 0],
          ['Set', 1, 3, 1, 1], ['Ott', 1, 3, 1, 1], ['Nov', 0, 2, 1, 0], ['Dic', 1, 2, 1, 0]
        ],
        year: [
          ['2021', 2, 6, 4, 2], ['2022', 3, 8, 4, 3], ['2023', 2, 7, 4, 3],
          ['2024', 3, 10, 6, 3], ['2025', 2, 12, 6, 4], ['2026', 2, 9, 5, 3]
        ]
      };
      return (datasets[period] || datasets.month).map(([label, incidente, nearMiss, manutenzione, rottura]) => ({
        label,
        value: incidente + nearMiss + manutenzione + rottura,
        breakdown: { incidente, nearMiss, manutenzione, rottura }
      }));
    }

        return acc;
      }, {});
    }

    function chatbotQualityMetrics(rows) {
      const total = rows.length;
      const unavailable = rows.filter(row => String(row.unavailable_answer || '').toLowerCase() === 'si').length;
      const incidentIds = new Set(rows.map(row => row.incident_id).filter(Boolean));
      const sourceCounts = rows.reduce((acc, row) => {
        const source = row.chat_source || 'N/D';
        acc[source] = (acc[source] || 0) + 1;
        return acc;
      }, {});
      const avgAnswerLength = total
        ? Math.round(rows.reduce((sum, row) => sum + Number(row.answer_length || String(row.answer || '').length || 0), 0) / total)
        : 0;
      const avgQuestionLength = total
        ? Math.round(rows.reduce((sum, row) => sum + Number(row.question_length || String(row.question || '').length || 0), 0) / total)
        : 0;
      const duplicateQuestions = total - new Set(rows.map(row => normalizeText(row.question || '')).filter(Boolean)).size;
      const unavailableRate = total ? Math.round((unavailable / total) * 100) : 0;
      const completeness = Math.max(0, 100 - unavailableRate);
      const depth = Math.min(100, Math.round((avgAnswerLength / 450) * 100));
      const coverage = Math.min(100, Math.round((incidentIds.size / Math.max(getIncidents().length, 1)) * 100));
      const reusePenalty = total ? Math.min(35, Math.round((duplicateQuestions / total) * 35)) : 0;
      const qualityIndex = total
        ? Math.max(0, Math.round((completeness * 0.45) + (depth * 0.25) + (coverage * 0.20) + ((100 - reusePenalty) * 0.10)))
        : 0;
      return {
        total,
        unavailable,
        unavailableRate,
        incidentCount: incidentIds.size,
        sourceCounts,
        avgAnswerLength,
        avgQuestionLength,
        duplicateQuestions,
        completeness,
        depth,
        coverage,
        qualityIndex
      };
    }

    function metricTone(value) {
      if (value >= 80) return { bg: '#dcfce7', color: '#166534', label: 'Ottimo' };
      if (value >= 60) return { bg: '#fef9c3', color: '#854d0e', label: 'Buono' };
      if (value >= 40) return { bg: '#ffedd5', color: '#9a3412', label: 'Da rivedere' };
      return { bg: '#fee2e2', color: '#991b1b', label: 'Critico' };
    }

    function exportChatArchiveCsv() {
      const rows = getChatArchive();
      if (!rows.length) return;
      const columns = [
        'id',
        'timestamp_iso',
        'timestamp_locale',
        'incident_id',
        'incident_category',
        'incident_department',
        'incident_line',
        'user',
        'user_role',
        'chat_source',
        'question',
        'answer',
        'question_length',
        'answer_length',
        'unavailable_answer'
      ];
      const csv = [
        columns.join(','),
        ...rows.map(row => columns.map(column => csvCell(row[column])).join(','))
      ].join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `archivio_chatbot_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function notificationBadgeClass(notification) {
      const type  = (notification.type  || '').toLowerCase();
      const level = (notification.level || '').toLowerCase();
      const search = type + ' ' + level;
      if (search.includes('incidente'))    return 'incidente';
      if (search.includes('infortunio'))   return 'infortunio';
      if (search.includes('near'))         return 'near';
      if (search.includes('manutenzione')) return 'manutenzione';
      if (search.includes('rottura'))      return 'rottura';
      if (search.includes('soccorsi'))     return 'soccorsi';
      if (search.includes('turno'))        return 'turno';
      if (search.includes('critico'))      return 'critico';
      if (search.includes('avviso'))       return 'avviso';
      if (search.includes('info'))         return 'info';
      return 'evento';
    }

    function notificationTypeClass(notification) {
      const badge = notificationBadgeClass(notification);
      return `type-${badge}`;
    }

    function notificationIncidentId(notification) {
      const match = `${notification.title || ''} ${notification.text || ''}`.match(/INC-\d{4}-\d{4}/);
      return match ? match[0] : '';

    function quantitativeMetrics(items) {
      const reports = items.flatMap(item => item.reports.map(report => report.report_confermato || report.dati || {}));
      const required = [
        'categoria_evento', 'data_ora', 'reparto', 'linea', 'macchinario_coinvolto',
        'persone_coinvolte', 'dinamica_evento', 'cause_probabili', 'conseguenze_operatore',
        'danni_materiali', 'azioni_immediate', 'livello_gravita'
      ];
      const total = Math.max(reports.length * required.length, 1);
      const filled = reports.reduce((sum, report) => sum + required.filter(field => report[field] && report[field] !== 'N/D').length, 0);
      const missing = total - filled;
      const precision = filled / Math.max(filled + Math.round(missing * 0.35), 1);
      const recall = filled / total;
      const f1 = (2 * precision * recall) / Math.max(precision + recall, 0.0001);
      const p0 = Math.min(0.98, 0.72 + recall * 0.22);
      const pe = 0.35;
      const kappa = (p0 - pe) / (1 - pe);
      return {
        kappa: formatMetric(kappa),
        precision: formatMetric(precision),
        recall: formatMetric(recall),
        f1: formatMetric(f1),
        cer: 'N/D',
        wer: 'N/D',
        dta: demoDomainTermAccuracy(reports),
        epr: 'N/D'
      };
    }

    function demoDomainTermAccuracy(reports) {
      const terms = ['pressa', 'carrello', 'robot', 'nastro', 'saldatore', 'macchinario', 'linea'];
      const text = normalizeText(reports.map(report => Object.values(report).join(' ')).join(' '));
      const found = terms.filter(term => text.includes(term)).length;
      if (!terms.length) return 'N/D';
      return `${Math.round((found / terms.length) * 100)}%`;
    }

    function formatMetric(value) {
      if (!Number.isFinite(value)) return 'N/D';
      return value <= 1 ? value.toFixed(2) : `${Math.round(value)}%`;
    }
