    function answerIncidentQuestion(incident, question) {
      const q = normalizeText(question);
      const intent = detectChatIntent(q);
      const docs = incident.reports.map((report, index) => buildChatDoc(report, index))
        .filter(doc => doc.data && Object.keys(doc.data).length);

      if (!docs.length) return unavailableAnswer();

      const intentAnswer = answerByIntent(intent, docs);
      if (intentAnswer) return intentAnswer;

      if (hasAny(q, ['discrepan', 'differenz', 'divers', 'contradd'])) {
        return findDiscrepancies(docs);
      }
      if (hasAny(q, ['macchinario', 'macchina', 'impianto', 'attrezz'])) {
        return answerFromField(docs, 'macchinario_coinvolto', 'Macchinario coinvolto');
      }
      if (hasAny(q, ['causa', 'cause', 'perche', 'perchè', 'perché', 'motivo'])) {
        return answerFromField(docs, 'cause_probabili', 'Cause riportate') || answerFromField(docs, 'causa_principale', 'Causa principale');
      }
      if (hasAny(q, ['male', 'lesion', 'infortun', 'ferit', 'dolor', 'schiacciat', 'mano', 'danno fisico', 'fatta male'])) {
        return answerInjury(docs);
      }
      if (hasAny(q, ['conseguenz'])) {
        return answerInjury(docs) || answerFromField(docs, 'conseguenze_operatore', 'Conseguenze operatore');
      }
      if (hasAny(q, ['danno', 'danni', 'rottur', 'guast'])) {
        if (hasAny(q, ['operatore', 'persona', 'riportato', 'subito', 'fisico', 'vittima'])) {
          return answerFromField(docs, 'vittime_danni', 'Danni riportati dagli operatori') || answerFromField(docs, 'conseguenze_operatore', 'Conseguenze operatore');
        }
        return answerFromField(docs, 'danni_materiali', 'Danni materiali');
      }
      if (hasAny(q, ['operatore', 'persona', 'chi'])) {
        if (hasAny(q, ['fatto', 'faceva', 'azione', 'azioni', 'comport', 'mosso', 'inserito', 'messo'])) {
          return answerOperatorAction(docs);
        }
        if (hasAny(q, ['coinvolt', 'coinvolta', 'coinvolto', 'persona', 'persone', 'chi'])) {
          return answerPeopleInvolved(docs);
        }
        return answerFromField(docs, 'persone_coinvolte', 'Persone coinvolte') || answerAuthors(docs);
      }
      if (hasAny(q, ['ora', 'quando', 'data', 'giorno'])) {
        return answerFromField(docs, 'data_ora', 'Orario/data evento');
      }
      if (hasAny(q, ['trascrizione', 'racconto', 'racconti'])) {
        return answerTranscriptions(docs);
      }
      if (hasAny(q, ['reparto', 'reprato', 'reperato', 'area', 'zona', 'luogo', 'dove'])) {
        return answerFromField(docs, 'reparto', 'Reparto') + (answerFromField(docs, 'linea', '') ? ' - Linea/Area: ' + answerFromField(docs, 'linea', '').replace(':', '') : '');
      }
      if (hasAny(q, ['dinamica', 'successo', 'accaduto', 'cosa'])) {
        return answerFromField(docs, 'dinamica_evento', 'Dinamica/Sintesi evento');
      }

      const ontologyMatch = findOntologyMatch(docs, q);
      if (ontologyMatch) return ontologyMatch;

      return keywordRetrieval(docs, q);
    }

    function detectChatIntent(q) {
      return Object.entries(CHAT_INTENTS)
        .map(([intent, phrases]) => ({
          intent,
          score: phrases.reduce((sum, phrase) => sum + (q.includes(normalizeText(phrase)) ? normalizeText(phrase).length : 0), 0)
        }))
        .filter(item => item.score > 0)
        .sort((a, b) => b.score - a.score)[0]?.intent || '';
    }

    function answerByIntent(intent, docs) {
      if (intent === 'discrepancies') return findDiscrepancies(docs);
      if (intent === 'machine') return answerFromField(docs, 'macchinario_coinvolto', 'Macchinario coinvolto');
      if (intent === 'cause') return answerFromField(docs, 'cause_probabili', 'Cause riportate') || answerFromField(docs, 'causa_principale', 'Causa principale');
      if (intent === 'injury') return answerInjury(docs);
      if (intent === 'consequences') return answerInjury(docs) || answerFromField(docs, 'conseguenze_operatore', 'Conseguenze operatore');
      if (intent === 'materialDamage') return answerFromField(docs, 'danni_materiali', 'Danni materiali');
      if (intent === 'operatorAction') return answerOperatorAction(docs);
      if (intent === 'people') return answerPeopleInvolved(docs);
      if (intent === 'time') return answerFromField(docs, 'data_ora', 'Orario/data evento');
      if (intent === 'transcription') return answerTranscriptions(docs);
      if (intent === 'location') return answerFromField(docs, 'reparto', 'Reparto') + (answerFromField(docs, 'linea', '') ? ' - Linea/Area: ' + answerFromField(docs, 'linea', '').replace(':', '') : '');
      if (intent === 'dynamics') return answerFromField(docs, 'dinamica_evento', 'Dinamica/Sintesi evento');
      if (intent === 'severity') return answerFromField(docs, 'livello_gravita', 'Gravità');
      if (intent === 'correctiveActions') return answerFromField(docs, 'azioni_immediate', 'Azioni immediate') || answerOntologyValue(docs, ['Azioni_Correttive', 'Azione_Correttiva_da_Implementare'], 'Azioni correttive');
      if (intent === 'procedure') return answerOntologyValue(docs, ['Azioni_Correttive', 'Procedura_Corretta_Violata'], 'Procedura') || answerOntologyValue(docs, ['Azioni_Correttive', 'DPI_Mancanti_o_Inadeguati'], 'DPI');
      return '';
    }

    function answerOntologyValue(docs, path, label) {
      const values = docs
        .map(doc => valueAtPath(doc.ai || doc.data.ai_report, path))
        .map(stringifyValue)
        .filter(value => value && value !== 'N/D');
      if (!values.length) return '';
      return formatChatAnswer(label, [...new Set(values)].join('; '));
    }

    function valueAtPath(obj, path) {
      return path.reduce((current, key) => current && current[key] !== undefined ? current[key] : undefined, obj);
    }

    function buildChatDoc(report, index) {
      const data = report.report_confermato || report.dati || {};
      const ai = report.ai_report || data.ai_report || null;
      return {
        index: index + 1,
        isUnified: report.audio_file === 'Report Fuso (Modalita B)',
        autore: report.autore || '',
        trascrizione: firstAvailable([
          report.trascrizione,
          data._meta?.trascrizione,
          data.trascrizione,
          ai?._meta?.trascrizione
        ]),
        data,
        ai
      };
    }

    function answerInjury(docs) {
      const candidates = docs.flatMap(doc => {
        const ai = doc.ai || doc.data.ai_report || {};
        const peopleDamage = Array.isArray(ai.Persone_Coinvolte)
          ? ai.Persone_Coinvolte.map(person => person.Danno_Riportato || person.Coinvolgimento || person.Note_Testimonianza)
          : [];
        return [
          doc.data.conseguenze_operatore,
          doc.data.vittime_danni,
          ai.Conseguenze?.Conseguenza_Fisica_Immediata,
          ai.Conseguenze?.Parte_Corpo_Lesa,
          ai.Conseguenze?.Giorni_Inabilita_Stimati,
          ...peopleDamage,
          relevantSentence(doc.trascrizione, ['male', 'schiacciat', 'mano', 'ferit', 'lesion', 'dolor', 'grave'])
        ].filter(value => value && value !== 'N/D');
      });

      const value = candidates.find(item => normalizeText(item) !== 'nessuna lesione') || '';
      if (value) return `Sì, risulta questo: ${conciseText(value, 24)}.`;

      const text = normalizeText(docs.map(docKnowledgeText).join(' '));
      if (hasAny(text, ['nessuna lesione', 'non si e fatta male', 'non ha riportato danni'])) {
        return 'No: nei report non risultano lesioni.';
      }
      return unavailableAnswer();
    }

    function answerPeopleInvolved(docs) {
      const aiDoc = docs.find(doc => doc.isUnified && doc.ai?.Persone_Coinvolte?.length)
        || docs.find(doc => doc.ai?.Persone_Coinvolte?.length);
      if (aiDoc) {
        const people = aiDoc.ai.Persone_Coinvolte
          .map(person => ({
            name: cleanPersonName(person.Nome),
            role: cleanValue(person.Ruolo_Aziendale),
            involvement: cleanValue(person.Coinvolgimento)
          }))
          .filter(person => person.name);
        const direct = people.filter(person => !normalizeText(person.involvement).includes('indirett'));
        const selected = direct.length ? direct : people;
        if (selected.length) {
          const names = selected.map(person => [person.name, person.role].filter(Boolean).join(', ')).join('; ');
          return selected.length === 1 ? `La persona coinvolta è ${names}.` : `Le persone coinvolte sono: ${names}.`;
        }
      }

      const value = firstAvailable(docs.map(doc => doc.data.persone_coinvolte));
      if (value) return `La persona coinvolta è ${concisePeople(value)}.`;
      return answerAuthors(docs);
    }

    function cleanPersonName(value) {
      const text = cleanValue(value);
      return text && normalizeText(text) !== 'n/d' ? text : '';
    }

    function cleanValue(value) {
      const text = String(value || '').trim();
      return text && text !== 'N/D' ? text : '';
    }

    function concisePeople(value) {
      return String(value || '')
        .split(';')
        .map(item => item.replace(/\s*-\s*Danno:.*$/i, '').trim())
        .filter(Boolean)
        .join('; ');
    }

    function answerOperatorAction(docs) {
      const candidates = docs.map(doc => {
        const ai = doc.ai || doc.data.ai_report || {};
        return {
          source: `Report ${doc.index}`,
          value: firstAvailable([
            doc.data.dinamica_evento,
            ai.Evento?.Dinamica_Sintesi,
            ai.Evento?.Trigger_Evento_Principale,
            ai.Analisi_Cause?.Fattore_Umano,
            doc.data.azioni_immediate
          ])
        };
      }).filter(item => item.value && item.value !== 'N/D');

      if (!candidates.length) return unavailableAnswer();
      const value = conciseText(candidates[0].value, 26);
      return `L'operatrice ha fatto questo: ${value}.`;
    }

    function findOntologyMatch(docs, q) {
      const docWithAi = docs.find(d => d.isUnified && d.ai) || docs.find(d => d.ai);
      if (!docWithAi) return null;
      
      const ai = docWithAi.ai;
      let bestMatch = null;
      let maxScore = 0;
      
      const checkField = (obj, section) => {
        if (!obj || typeof obj !== 'object') return;
        if (Array.isArray(obj)) return;
        Object.keys(obj).forEach(k => {
           if (typeof obj[k] === 'object' && obj[k] !== null && !Array.isArray(obj[k])) {
             checkField(obj[k], k);
           } else {
             const keyNorm = normalizeText(k.replace(/_/g, ' '));
             const keyTokens = keyNorm.split(' ').filter(w => w.length > 2);
             let score = 0;
             keyTokens.forEach(kt => {
               // Rimuove l'ultima lettera (vocale finale) per supportare maschile/femminile e singolare/plurale
               const stem = kt.length > 4 ? kt.slice(0, -1) : kt;
               if (q.includes(stem)) score += 2;
             });
             
             if (q.includes(keyNorm)) score += 5;
             
             if (score > 2 && score > maxScore) {
               maxScore = score;
               bestMatch = { section, key: k };
             }
           }
        });
      };
      checkField(ai, '');
      
      if (bestMatch && maxScore > 2) {
        const fieldLabel = bestMatch.key.replace(/_/g, ' ');
        const unified = docs.find(d => d.isUnified && d.ai);
        
        // Controlla se il campo esiste nel report unificato (anche se N/D)
        const unifiedHasField = unified && unified.ai[bestMatch.section] && unified.ai[bestMatch.section][bestMatch.key] !== undefined;
        
        if (unified && unified.ai[bestMatch.section] && unified.ai[bestMatch.section][bestMatch.key]) {
          const val = unified.ai[bestMatch.section][bestMatch.key];
          if (val && val !== 'N/D') return formatChatAnswer(fieldLabel, val);
          if (unifiedHasField) return unavailableAnswer();
        }
        
        const vals = docs.filter(d => !d.isUnified && d.ai && d.ai[bestMatch.section] && d.ai[bestMatch.section][bestMatch.key])
          .map(d => ({ value: stringifyValue(d.ai[bestMatch.section][bestMatch.key]), source: `Report ${d.index}` }))
          .filter(item => item.value && item.value !== 'N/D');
          
        if (vals.length) {
          const unique = [...new Map(vals.map(item => [item.value, item])).values()];
          return formatChatAnswer(fieldLabel, unique.map(item => item.value).join('; '));
        }
        
        // Campo trovato semanticamente ma N/D ovunque
        if (unifiedHasField || bestMatch.section) {
          return unavailableAnswer();
        }
      }
      return null;
    }

    function answerFromField(docs, field, label) {
      const unifiedDoc = docs.find(doc => doc.isUnified);
      if (unifiedDoc) {
        const val = stringifyValue(unifiedDoc.data[field]);
        if (val && val !== 'N/D') {
          return formatChatAnswer(label, val);
        }
        // Campo esiste nel report unificato ma è N/D: non cadere nel fallback
        if (val === 'N/D' || val === '') {
          return label ? unavailableAnswer() : '';
        }
      }
      
      const values = docs
        .filter(doc => !doc.isUnified)
        .map(doc => ({ value: stringifyValue(doc.data[field]), source: `Report ${doc.index}` }))
        .filter(item => item.value && item.value !== 'N/D');
      if (!values.length) return '';
      const unique = [...new Map(values.map(item => [item.value, item])).values()];
      return formatChatAnswer(label, unique.map(item => item.value).join('; '));
    }

    function formatChatAnswer(label, value) {
      const text = conciseText(value, 32);
      const normalizedLabel = normalizeText(label);
      if (hasAny(normalizedLabel, ['macchinario'])) return `Il macchinario coinvolto è ${text}.`;
      if (hasAny(normalizedLabel, ['reparto'])) return `È successo nel reparto ${text}.`;
      if (hasAny(normalizedLabel, ['linea', 'area'])) return `L'area indicata è ${text}.`;
      if (hasAny(normalizedLabel, ['orario', 'data'])) return `La data/ora indicata è ${text}.`;
      if (hasAny(normalizedLabel, ['gravita'])) return `La gravità stimata è ${text}.`;
      if (hasAny(normalizedLabel, ['danni materiali'])) return `Per i danni materiali risulta: ${text}.`;
      if (hasAny(normalizedLabel, ['azioni immediate', 'azioni correttive'])) return `Azione prevista: ${text}.`;
      if (hasAny(normalizedLabel, ['procedura'])) return `La procedura segnalata è: ${text}.`;
      if (hasAny(normalizedLabel, ['dpi'])) return `Per i DPI risulta: ${text}.`;
      if (!label || hasAny(normalizedLabel, [
        'dinamica',
        'sintesi',
        'persone coinvolte',
        'conseguenze operatore',
        'cause riportate',
        'danni riportati',
        'fattore umano',
        'trigger evento',
        'prima dell evento'
      ])) {
        return `${text}.`;
      }
      return `${label}: ${text}.`;
    }

    function answerAuthors(docs) {
      const authors = [...new Set(docs.map(doc => doc.autore).filter(Boolean))];
      if (!authors.length) return unavailableAnswer();
      return `Nei report compaiono ${authors.join(', ')}.`;
    }

    function answerTranscriptions(docs) {
      const rows = docs.filter(doc => doc.trascrizione).map(doc => `"${conciseText(doc.trascrizione, 35)}"`);
      return rows.length ? rows.join(' ') : unavailableAnswer();
    }

    function findDiscrepancies(docs) {
      const fields = [
        ['data_ora', 'data/ora'],
        ['reparto', 'reparto'],
        ['linea', 'linea'],
        ['macchinario_coinvolto', 'macchinario'],
        ['cause_probabili', 'cause'],
        ['conseguenze_operatore', 'conseguenze'],
        ['danni_materiali', 'danni'],
        ['dinamica_evento', 'dinamica']
      ];
      const differences = fields.map(([field, label]) => {
        const values = docs.map(doc => stringifyValue(doc.data[field])).filter(Boolean);
        const unique = [...new Set(values)];
        return unique.length > 1 ? `${label}: ${unique.join(' / ')}` : '';
      }).filter(Boolean);
      return differences.length
        ? `Ci sono differenze tra i report su questi punti: ${differences.join('; ')}.`
        : 'Non emergono discrepanze evidenti tra i report confermati disponibili.';
    }

    function keywordRetrieval(docs, question) {
      const tokens = question.split(' ').filter(word => word.length > 3);
      const matches = docs.map(doc => {
        const text = normalizeText(docKnowledgeText(doc));
        const score = tokens.reduce((sum, token) => sum + (text.includes(token) ? 1 : 0), 0);
        return { doc, score };
      }).filter(item => item.score > 0).sort((a, b) => b.score - a.score);
      if (!matches.length) return unavailableAnswer();
      const best = matches[0].doc;
      const source = best.data.dinamica_evento || best.data.cause_probabili || best.data.conseguenze_operatore || best.trascrizione || stringifyValue(best.data);
      return `${conciseText(source, 32)}.`;
    }

    function firstAvailable(values) {
      return values.find(value => value && value !== 'N/D') || '';
    }

    function relevantSentence(text, needles) {
      const sentences = String(text || '')
        .replace(/\s+/g, ' ')
        .split(/(?<=[.!?])\s+|;\s+|\n+/)
        .map(sentence => sentence.trim())
        .filter(Boolean);
      return sentences.find(sentence => {
        const normalized = normalizeText(sentence);
        return needles.some(needle => normalized.includes(needle));
      }) || '';
    }

    function docKnowledgeText(doc) {
      return [
        doc.trascrizione,
        stringifyValue(doc.data),
        stringifyValue(doc.ai)
      ].filter(Boolean).join(' ');
    }

    function conciseText(value, maxWords = 28) {
      const text = String(value || '').replace(/\s+/g, ' ').trim();
      const sentence = text.match(/^(.{20,220}?[.!?])\s/)?.[1] || text;
      const words = sentence.split(' ').filter(Boolean);
      const short = words.length > maxWords ? `${words.slice(0, maxWords).join(' ')}...` : sentence;
      return short.replace(/^["'“”]+|["'“”]+$/g, '');
    }

    function stringifyValue(value) {
      if (Array.isArray(value)) {
        return value.map(item => stringifyValue(item)).filter(Boolean).join(', ');
      }
      if (value && typeof value === 'object') return Object.values(value).map(item => stringifyValue(item)).filter(Boolean).join(' ');
      return value ? String(value) : '';
    }

    function hasAny(text, needles) {
      return needles.some(needle => text.includes(needle));
    }

    function normalizeText(value) {
      return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function unavailableAnswer() {
      return 'L’informazione non è disponibile nei report confermati.';
    }

    function kpi(label, value) {
      return `<section class="panel kpi"><span class="muted">${label}</span><strong>${value}</strong></section>`;
    }

    function pct(value, total) {
      return `${Math.round((value / Math.max(total, 1)) * 100)}%`;
    }

    function chartCard(title, data, maxValue, compact) {
      const entries = Object.entries(data).sort((a, b) => b[1] - a[1]).slice(0, compact ? 8 : 10);
      return `<section class="panel chart-card">
        <h3>${title}</h3>
        ${entries.length ? entries.map(([label, value]) => metricRow(label, value, maxValue)).join('') : '<p class="muted">Nessun dato disponibile.</p>'}
      </section>`;
    }

    function metricRow(label, value, maxValue) {
      const width = Math.round((value / Math.max(maxValue, 1)) * 100);
      return `<div class="metric-row">
        <strong>${label || 'N/D'}</strong>
        <div class="bar"><div style="width:${width}%"></div></div>
        <span>${value}</span>
      </div>`;
    }

    function trendCard(title, data) {
      const entries = Object.entries(data);
      const max = maxCount(data);
      return `<section class="panel chart-card">
        <h3>${title}</h3>
        <div class="trend">
          ${entries.map(([label, value]) => `<div class="trend-column">
            <div class="trend-bar" style="height:${Math.max(8, (value / Math.max(max, 1)) * 150)}px"></div>
            <span>${label}</span>
          </div>`).join('')}
        </div>
      </section>`;
    }

    function maxCount(data) {
      return Math.max(1, ...Object.values(data));
    }

    function countBy(items, key) {
      return items.reduce((acc, item) => {
        const value = key === 'categoria' ? normalizeCategory(item[key]) : item[key];
        acc[value] = (acc[value] || 0) + 1;
        return acc;
      }, {});
    }

    function normalizeCategory(value) {
      const text = String(value || '').toLowerCase();
      if (text.includes('near')) return 'Near miss';
      if (text.includes('manutenzione')) return 'Operazione di manutenzione';
      if (text.includes('rottura')) return 'Rottura macchinario';
      return 'Incidente';
    }

    function countFromReports(items, key) {
      return items.reduce((acc, incident) => {
        incident.reports.forEach(report => {
          const data = report.report_confermato || report.dati || {};
          let value = data[key] || 'N/D';
          if (key === 'cause_probabili') value = data.causa_principale || value;
          acc[value] = (acc[value] || 0) + 1;
        });
        return acc;
      }, {});
    }

    function countTrend(items) {
      const trend = {};
      items.forEach(item => {
        const parts = String(item.data || '').split(' ')[0].split('/');
        const label = parts.length === 3 ? `${parts[1]}/${parts[2]}` : 'N/D';
        trend[label] = (trend[label] || 0) + 1;
      });
      return trend;
    }

    function currentReportData(incident) {
      const report = incident.reports[0] || {};
      return report.report_confermato || report.dati || {};
    }

    function incidentDepartmentValues(incident) {
      const reports = incident.reports || [];
      const reportData = reports.map(report => report.report_confermato || report.dati || {});
      return [
        incident.reparto,
        ...reportData.flatMap(data => [
          data.reparto,
          data.Reparto,
          data.ai_report?.Luoghi_e_Mezzi?.Reparto,
          data.Luoghi_e_Mezzi?.Reparto
        ])
      ].filter(value => value && value !== 'N/D');
    }

    function incidentDepartmentOptions(items) {
      const byKey = new Map();
      items.flatMap(incidentDepartmentValues).forEach(value => {
        const label = String(value).trim();
        const key = normalizeText(label);
        if (label && !byKey.has(key)) byKey.set(key, label);
      });
      return [...byKey.values()].sort((a, b) => a.localeCompare(b, 'it'));
    }

    function filterIncidentFolders() {
      if (!document.getElementById('incidentTable')) return;
      const q = normalizeText(document.getElementById('search')?.value || '');
      const cat = document.getElementById('catFilter')?.value || 'Tutte';
      const dept = document.getElementById('deptFilter')?.value || 'Tutti';
      const date = document.getElementById('dateFilter')?.value || '';
      const severity = document.getElementById('severityFilter')?.value || 'Tutte';
      const filtered = getIncidents().filter(incident => {
        const reports = incident.reports || [];
        const reportData = reports.map(report => report.report_confermato || report.dati || {});
        const searchableCode = normalizeText([
          incident.id,
          ...reports.map(report => report.id_report),
          ...reportData.map(data => data.id_incidente || data.id_report)
        ].filter(Boolean).join(' '));
        const categories = [incident.categoria, ...reportData.map(data => data.categoria_evento || data.Tipo_Evento)];
        const departments = incidentDepartmentValues(incident);
        const severities = reportData.map(data => data.livello_gravita || data.Gravita_Stimata);
        const dates = [incident.data, ...reportData.map(data => data.data_ora || data.Data_Ora)];

        const codeMatch = !q || searchableCode.includes(q);
        const catMatch = cat === 'Tutte' || categories.some(value => normalizeCategory(value) === cat);
        const deptMatch = dept === 'Tutti' || departments.some(value => normalizeText(value) === normalizeText(dept));
        const dateMatch = !date || dates.some(value => incidentDateToInput(value) === date);
        const severityMatch = severity === 'Tutte' || severities.some(value => normalizeText(value) === normalizeText(severity));
        return codeMatch && catMatch && deptMatch && dateMatch && severityMatch;
      });
      paintTable(filtered);
    }

    function incidentDateToInput(value) {
      const raw = String(value || '').trim();
      const iso = raw.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (iso) return `${iso[1]}-${iso[2].padStart(2, '0')}-${iso[3].padStart(2, '0')}`;

      const italian = raw.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (!italian) return '';
      const [, day, month, yearValue] = italian;
      const year = yearValue.length === 2 ? `20${yearValue}` : yearValue;
      return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
    }

    function qualityScore(inc) {
      const values = Object.values(inc.reports[0].dati || {});
      const filled = values.filter(v => v && v !== 'N/D').length;
      return Math.round((filled / values.length) * 100);
    }

    function loginAs(username) {
      const user = users.find(u => u.username === username);
      if (user) login(user);
    }

    els.logoutBtn.addEventListener('click', event => {
      event.stopPropagation();
      currentUser = null;
      els.appScreen.classList.add('hidden');
      els.loginScreen.classList.remove('hidden');
    });

    els.nav.addEventListener('click', event => {
      const btn = event.target.closest('[data-view]');
      if (!btn) return;
      activeView = btn.dataset.view;
      selectedIncident = null;
      render();
    });

    els.sidebarTools.addEventListener('click', event => {
      const btn = event.target.closest('[data-sidebar-action]');
      if (!btn) return;
      const action = btn.dataset.sidebarAction;
      if (action === 'dashboard') activeView = 'analytics';
      if (action === 'manager-audio') activeView = 'managerAudio';
      if (action === 'folders') activeView = 'incidents';
      if (action === 'notifications') activeView = 'notifications';
      if (action === 'quality') activeView = 'quality';
      if (action === 'support-ticket') activeView = 'supportTicket';
      if (action === 'new-report') {
        activeView = 'operator';
        operatorStep = 'category';
        draft = {};
      }
      if (action === 'operator-incidents') {
        activeView = 'operatorIncidents';
        selectedIncident = null;
      }
      if (action === 'reset-demo') {
        if (!confirm('Vuoi ripristinare i dati demo iniziali?')) return;
        localStorage.removeItem('safetyIncidents');
        selectedIncident = null;
        draft = {};
        operatorStep = 'category';
      }
      selectedIncident = null;
      render();
    });

    els.backBtn.addEventListener('click', () => {
      selectedIncident = null;
      render();
    });

    els.content.addEventListener('click', event => {
      const target = event.target.closest('button, tr');
      if (!target) return;
      if (target.dataset.deleteReport !== undefined) {
        const index = parseInt(target.dataset.deleteReport, 10);
        if (!confirm('Vuoi eliminare questo report?')) return;
        selectedIncident.reports.splice(index, 1);
        const allIncidents = getIncidents().map(i => i.id === selectedIncident.id ? selectedIncident : i);
        saveIncidents(allIncidents);
        renderIncidents();
        return;
      }
      if (target.dataset.supportCancel !== undefined) {
        activeView = currentUser?.ruolo === 'manager' ? 'analytics' : 'operator';
        render();
        return;
      }
      if (target.id === 'fuseReportsBtn') {
        fuseIncidentReports(target.dataset.fuseIncident);
        return;
      }
      if (target.id === 'fuseReportsMultiBtn') {
        const runsCount = parseInt(document.getElementById('fusionRunsInput').value) || 3;
        fuseIncidentReportsMulti(target.dataset.fuseIncident, runsCount);
        return;
      }
      if (target.id === 'closeFusionAnalysisBtn') {
        activeFusionRuns = null;
        activeFusionRunsIncidentId = null;
        render();
        return;
      }
      if (target.dataset.saveFusionRun !== undefined) {
        const runIdx = parseInt(target.dataset.saveFusionRun);
        const incidentId = activeFusionRunsIncidentId;
        const incident = getIncidents().find(i => i.id === incidentId);
        if (!incident) return;
        
        const fusedData = activeFusionRuns[runIdx];
        const flat = ontologyToFlat(fusedData.dati, { id: incidentId, autore: 'Manager', timestamp: new Date().toISOString() });
        
        const newReport = {
          audio_file: 'Report Fuso (Modalita B)',
          autore: 'Manager',
          dati: flat,
          report_confermato: flat,
          timestamp_creazione: new Date().toISOString()
        };
        
        incident.reports = incident.reports.filter(r => r.audio_file !== 'Report Fuso (Modalita B)');
        incident.reports.push(newReport);
        const allIncidents = getIncidents().map(i => i.id === incidentId ? incident : i);
        saveIncidents(allIncidents);
        
        activeFusionRuns = null;
        activeFusionRunsIncidentId = null;
        
        render();
        alert('Report unificato salvato con successo usando la Run ' + (runIdx + 1) + '!');
        return;
      }
      if (target.dataset.clearNotifications !== undefined) {
        if (!confirm('Vuoi svuotare tutte le notifiche manager?')) return;
        saveNotifications([]);
        renderSidebarTools();
        renderNotifications();
        return;
      }
      if (target.dataset.exportChatArchive !== undefined) {
        exportChatArchiveCsv();
        return;
      }
      if (target.dataset.clearChatArchive !== undefined) {
        if (!confirm('Vuoi svuotare l archivio del chatbot?')) return;
        saveChatArchive([]);
        render();
        return;
      }
      if (target.dataset.plantZoom) {
        if (target.dataset.plantZoom === 'in') plantMapZoom = Math.min(2.5, plantMapZoom + 0.2);
        if (target.dataset.plantZoom === 'out') {
          plantMapZoom = Math.max(1, plantMapZoom - 0.2);
          if (plantMapZoom === 1) { plantMapPanX = 0; plantMapPanY = 0; }
        }
        if (target.dataset.plantZoom === 'reset') { plantMapZoom = 1; plantMapPanX = 0; plantMapPanY = 0; }
        renderAnalytics();
        return;
      }
      if (target.dataset.incidentChartPeriod) {
        incidentChartPeriod = target.dataset.incidentChartPeriod;
        renderAnalytics();
        return;
      }
      if (target.dataset.mapIncidentOpen) {
        selectedIncident = getIncidents().find(i => i.id === target.dataset.mapIncidentOpen);
        floatingChatMessages = [];
        inlineChatMessages = [];
        activeView = 'incidents';
        renderIncidents();
        renderFloatingChat();
        return;
      }
      if (target.dataset.notificationFilter) {
        notificationFilter = target.dataset.notificationFilter;
        renderNotifications();
        return;
      }
      if (target.dataset.category) {
        draft.categoria_evento = target.dataset.category;
        operatorStep = 'audio';
        draft.folderId = null;
        renderOperator();
      }
      if (target.dataset.newFolder !== undefined) {
        draft.folderId = null;
        operatorStep = 'audio';
        renderOperator();
      }
      if (target.dataset.existingFolder) {
        const folder = getIncidents().find(i => i.id === target.dataset.existingFolder);
        draft.folderId = folder.id;
        draft.categoria_evento = folder.categoria;
        draft.reparto = folder.reparto;
        draft.linea = folder.linea;
        operatorStep = 'audio';
        renderOperator();
      }
      if (target.dataset.showUpload !== undefined) {
        showUploadPanel();
      }
      if (target.dataset.showRecord !== undefined) {
        showRecordPanel();
      }
      if (target.dataset.startRecord !== undefined) {
        startRecording().catch(() => alert('Non riesco ad accedere al microfono. Controlla i permessi del browser.'));
      }
      if (target.dataset.stopRecord !== undefined) {
        stopRecording();
      }
      if (target.dataset.saveRecord !== undefined && recordedBlob) {
        sendAudioToTranscriptionPipeline(recordedBlob, 'registrazione_microfono.webm');
      }
      if (target.dataset.editReview !== undefined) {
        reviewEditing = true;
        renderOperator();
      }
      if (target.dataset.drill) {
        activeDrill = target.dataset.drill;
        renderAnalytics();
      }
      if (target.dataset.managerAudioRun !== undefined) {
        runManagerIncidentAnalysis();
      }
      if (target.dataset.analyzeNotification) {
        activeView = 'managerAudio';
        render();
        return;
      }
      if (target.dataset.managerAudioFusion !== undefined) {
        runManagerAudioFusion();
      }
      if (target.dataset.managerAudioClear !== undefined) {
        managerAudioResult = null;
        renderManagerAudio();
      }
      if (target.dataset.saveManagerReport !== undefined) {
        saveManagerAudioReport(target.dataset.saveManagerReport);
      }
      if (target.dataset.backCategory !== undefined) {
        operatorStep = 'category';
        renderOperator();
      }
      if (target.dataset.reset !== undefined) {
        draft = {};
        reviewEditing = false;
        operatorStep = 'category';
        renderOperator();
      }
      if (target.dataset.operatorLogout !== undefined) {
        currentUser = null;
        draft = {};
        reviewEditing = false;
        els.appScreen.classList.add('hidden');
        els.loginScreen.classList.remove('hidden');
      }
      if (target.dataset.goManager !== undefined) {
        activeView = currentUser.ruolo === 'manager' ? 'incidents' : 'operator';
        operatorStep = 'category';
        render();
      }
      if (target.dataset.open) {
        if (event.target.closest('button')) return; // ignore if click came from a button inside the row
        selectedIncident = getIncidents().find(i => i.id === target.dataset.open);
        floatingChatMessages = [];
        inlineChatMessages = [];
        if (activeView === 'operatorIncidents') {
          renderOperatorIncidents();
        } else {
          renderIncidents();
        }
        renderFloatingChat();
      }
    });

    els.appScreen.addEventListener('click', event => {
      if (event.target.closest('[data-floating-chat-toggle]')) {
        floatingChatOpen = !floatingChatOpen;
        renderFloatingChat();
      }
      if (event.target.closest('[data-floating-chat-close]')) {
        floatingChatOpen = false;
        renderFloatingChat();
      }
    });

    els.content.addEventListener('change', event => {
      const readToggle = event.target.closest('[data-toggle-notification-read]');
      if (!readToggle) return;
      const notifications = getNotifications();
      const next = notifications.map(notification => notification.id === readToggle.dataset.toggleNotificationRead
        ? { ...notification, read: readToggle.checked }
        : notification);
      saveNotifications(next);
      renderSidebarTools();
      renderNotifications();
    });

    els.content.addEventListener('submit', async event => {
      if (event.target.id === 'supportTicketForm') {
        event.preventDefault();
        const form = new FormData(event.target);
        const now = new Date();
        const ticket = {
          id: `SUP-${now.getFullYear()}-${String(now.getTime()).slice(-6)}`,
          timestamp: now.toISOString(),
          requester: form.get('requester'),
          priority: form.get('priority'),
          role: form.get('role'),
          subject: form.get('subject'),
          description: form.get('description'),
          status: 'Aperto'
        };
        const tickets = JSON.parse(localStorage.getItem('supportTickets') || '[]');
        localStorage.setItem('supportTickets', JSON.stringify([ticket, ...tickets]));
        els.content.innerHTML = `<section class="panel success support-ticket-panel">
          <span class="badge ok">Ticket creato</span>
          <h2 style="margin-top:12px;">${ticket.id}</h2>
          <p class="muted">La richiesta di supporto è stata registrata.</p>
          <div class="detail-grid" style="margin-top:18px;">
            <div class="detail-item"><span>Ruolo</span>${escapeHtml(ticket.role)}</div>
            <div class="detail-item"><span>Priorità</span>${escapeHtml(ticket.priority)}</div>
            <div class="detail-item full"><span>Oggetto</span>${escapeHtml(ticket.subject)}</div>
          </div>
          <div class="actions"><button class="primary-btn" type="button" data-support-cancel>Torna alla dashboard</button></div>
        </section>`;
        return;
      }
      if (event.target.id === 'fusionQualityForm') {
        event.preventDefault();
        const incidentSelect = document.getElementById('fusionIncidentSelect');
        const runsInput = document.getElementById('fusionRunsInput');
        if (!incidentSelect || !runsInput) return;
        const selectedIncidentId = incidentSelect.value;
        const selectedRuns = parseInt(runsInput.value) || 3;
        
        await fuseIncidentReportsMulti(selectedIncidentId, selectedRuns);
        return;
      }
      if (event.target.id === 'chatForm') {
        event.preventDefault();
        const input = document.getElementById('chatQuestion');
        const question = input.value.trim();
        if (!question || !selectedIncident) return;
        
        inlineChatMessages.push({ role: 'user', text: question });
        const log = document.getElementById('chatLog');
        log.insertAdjacentHTML('beforeend', `<div class="chat-message user">${escapeHtml(question)}</div><div id="inlineLoading" class="chat-message bot"><em>Elaborazione in corso...</em></div>`);
        log.scrollTop = log.scrollHeight;
        input.value = '';
        
        try {
          const res = await fetch(apiUrl('/api/chat'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              messages: inlineChatMessages,
              incident_data: selectedIncident
            })
          });
          const result = await res.json();
          document.getElementById('inlineLoading').remove();
          
          if (result.success) {
             const answer = result.response;
             inlineChatMessages.push({ role: 'bot', text: answer });
             archiveChatInteraction({ question, answer, source: 'inline' });
             log.insertAdjacentHTML('beforeend', `<div class="chat-message bot">${escapeHtml(answer)}</div>`);
          } else {
             log.insertAdjacentHTML('beforeend', `<div class="chat-message bot" style="color:var(--red);">Errore: ${escapeHtml(result.error)}</div>`);
             inlineChatMessages.pop(); // Rimuovo la domanda per non inquinare la history con errori
          }
        } catch (e) {
          document.getElementById('inlineLoading').remove();
          log.insertAdjacentHTML('beforeend', `<div class="chat-message bot" style="color:var(--red);">Errore di rete.</div>`);
          inlineChatMessages.pop();
        }
        log.scrollTop = log.scrollHeight;
        return;
      }
      if (event.target.id !== 'reviewForm') return;
      event.preventDefault();
      const form = new FormData(event.target);
      for (const [key, value] of form.entries()) draft[key] = value;
      const items = getIncidents();
      const id = draft.folderId || nextIncidentId(items);
      draft.id_incidente = id;
      const newReport = {
        id_report: `RPT-${Date.now()}`,
        autore: draft.autore || `${currentUser.nome} ${currentUser.cognome}`,
        timestamp_creazione: draft.timestamp_creazione || new Date().toISOString(),
        audio_file: draft.audio_source || '',
        trascrizione: draft.trascrizione || draft.dinamica_evento,
        report_confermato: { ...draft, id_incidente: id },
        dati: { ...draft, id_incidente: id },
        ai_report: draft.ai_report || null,
        ai_report_multiple: draft.ai_report_multiple || null
      };
      // Aggiorna id_evento nell'ai_report se presente
      if (newReport.ai_report && newReport.ai_report.Evento) {
        newReport.ai_report.Evento.id_evento = id;
      }
      if (newReport.ai_report_multiple) {
        newReport.ai_report_multiple.forEach(r => {
          if (r.Evento) r.Evento.id_evento = id;
        });
      }
      const uploadDateStr = draft.upload_date || new Date().toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' });
      const existing = items.find(i => i.id === id);
      if (existing) {
        existing.categoria = existing.categoria || draft.categoria_evento;
        existing.data = existing.data || uploadDateStr;
        existing.reparto = existing.reparto || draft.reparto;
        existing.linea = existing.linea || draft.linea;
        existing.reports.push(newReport);
        
        if (draft.folderId) {
          const notifications = getNotifications();
          notifications.push({
            id: `NTF-${Date.now()}-MATCH`,
            time: new Date().toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }),
            level: 'Info',
            type: 'evento',
            read: false,
            title: `Nuovo report associato a ${id}`,
            text: `Un nuovo report di ${newReport.autore} è stato associato automaticamente all'incidente ${id}.`
          });
          saveNotifications(notifications);
          renderSidebarTools();
        }
      } else {
        items.push({
          id,
          categoria: draft.categoria_evento,
          data: uploadDateStr,
          reparto: draft.reparto,
          linea: draft.linea,
          reports: [newReport],
          report_unificato: false
        });
      }
      saveIncidents(items);
      draft.savedId = id;
      reviewEditing = false;
      operatorStep = 'success';
      renderOperator();
    });

    els.appScreen.addEventListener('submit', async event => {
      if (event.target.id !== 'floatingChatForm') return;
      event.preventDefault();
      const input = document.getElementById('floatingChatQuestion');
      const question = input.value.trim();
      if (!question || !selectedIncident) return;
      
      floatingChatMessages.push({ role: 'user', text: question });
      input.value = '';
      
      floatingChatMessages.push({ role: 'bot', text: 'Elaborazione in corso...', isLoading: true });
      renderFloatingChat();
      
      try {
        const res = await fetch(apiUrl('/api/chat'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: floatingChatMessages.filter(m => !m.isLoading),
            incident_data: selectedIncident
          })
        });
        const result = await res.json();
        floatingChatMessages.pop(); // Rimuovi elaborazione in corso
        
        if (result.success) {
           const answer = result.response;
           floatingChatMessages.push({ role: 'bot', text: answer });
           archiveChatInteraction({ question, answer, source: 'floating' });
        } else {
           floatingChatMessages.push({ role: 'bot', text: `Errore: ${result.error}` });
           floatingChatMessages.splice(-3, 1);
        }
      } catch (e) {
        floatingChatMessages.pop();
        floatingChatMessages.push({ role: 'bot', text: `Errore di rete.` });
        floatingChatMessages.splice(-3, 1);
      }
      renderFloatingChat();
    });

    els.content.addEventListener('input', event => {
      if (!['search', 'catFilter', 'deptFilter', 'dateFilter', 'severityFilter'].includes(event.target.id)) return;
      filterIncidentFolders();
    });

    els.content.addEventListener('change', event => {
      if (event.target.id === 'managerAudioUploadA' || event.target.id === 'managerAudioUploadB') {
        const count = event.target.files ? event.target.files.length : 0;
        const status = document.getElementById('managerAudioStatus');
        const mode = event.target.id === 'managerAudioUploadB' ? 'Modalita B' : 'Modalita A';
        if (status) status.textContent = count ? `${mode}: ${count} file selezionati.` : 'In attesa dei file audio.';
      }
      if (event.target.id === 'audioUpload' && event.target.files && event.target.files[0]) {
        handleSelectedAudioFile(event.target.files[0]);
      }
      if (['dateFilter', 'catFilter', 'deptFilter', 'severityFilter'].includes(event.target.id)) {
        filterIncidentFolders();
      }
    });
    let isMapPanning = false;
    let mapStartX = 0;
    let mapStartY = 0;

    document.addEventListener('mousedown', e => {
      const map = e.target.closest('.dashboard-plant-map');
      if (map && plantMapZoom > 1) {
        if (e.button !== 0) return;
        isMapPanning = true;
        mapStartX = e.clientX - plantMapPanX;
        mapStartY = e.clientY - plantMapPanY;
        map.style.cursor = 'grabbing';
        const inner = map.querySelector('.dashboard-plant-map-inner');
        if (inner) inner.style.transition = 'none';
        e.preventDefault();
      }
    });

    document.addEventListener('mousemove', e => {
      if (!isMapPanning) return;
      plantMapPanX = e.clientX - mapStartX;
      plantMapPanY = e.clientY - mapStartY;
      const inner = document.querySelector('.dashboard-plant-map-inner');
      if (inner) {
        inner.style.transform = `scale(${plantMapZoom}) translate(${plantMapPanX / plantMapZoom}px, ${plantMapPanY / plantMapZoom}px)`;
      }
    });

    document.addEventListener('mouseup', e => {
      if (isMapPanning) {
        isMapPanning = false;
        const map = document.querySelector('.dashboard-plant-map');
        if (map) map.style.cursor = 'grab';
        const inner = document.querySelector('.dashboard-plant-map-inner');
        if (inner) inner.style.transition = '';
      }
    });

    document.addEventListener('mouseleave', e => {
      if (isMapPanning) {
        isMapPanning = false;
        const map = document.querySelector('.dashboard-plant-map');
        if (map) map.style.cursor = 'grab';
        const inner = document.querySelector('.dashboard-plant-map-inner');
        if (inner) inner.style.transition = '';
      }
    });

    document.addEventListener('mouseover', e => {
      const col = e.target.closest('.histogram-column');
      if (col && col.dataset.hoverTotal) {
        updateSeverityDonut(parseInt(col.dataset.hoverTotal, 10) || 0);
      }
    });

    document.addEventListener('mouseout', e => {
      const col = e.target.closest('.histogram-column');
      if (col) {
        const donutEl = document.getElementById('severityDonutEl');
        if (donutEl && donutEl.dataset.defaultTotal) {
          updateSeverityDonut(parseInt(donutEl.dataset.defaultTotal, 10) || 0);
        }
      }
    });

    function updateSeverityDonut(total) {
      const donutEl = document.getElementById('severityDonutEl');
      if (!donutEl) return;
      
      const altaCount = Math.round(total * 0.15);
      const mediaCount = Math.round(total * 0.45);
      const bassaCount = Math.round(total * 0.35);
      const ndCount = total - altaCount - mediaCount - bassaCount;

      const rows = [
        ['Alta', altaCount, '#dc2626'],
        ['Media', mediaCount, '#f59e0b'],
        ['Bassa', bassaCount, '#16a34a'],
        ['N/D', ndCount, '#94a3b8']
      ];
      
      let cursor = 0;
      const donutStops = total ? rows.map(([, value, color]) => {
        const start = cursor;
        cursor += (value / total) * 100;
        return `${color} ${start}% ${cursor}%`;
      }).join(', ') : '#e2e8f0 0 100%';
      
      donutEl.style.background = `conic-gradient(${donutStops})`;
      donutEl.dataset.total = total;
      
      const legendEls = document.querySelectorAll('.severity-legend-row .severity-val');
      if (legendEls.length === 4) {
        legendEls[0].textContent = altaCount;
        legendEls[1].textContent = mediaCount;
        legendEls[2].textContent = bassaCount;
        legendEls[3].textContent = ndCount;
      }
    }
    function renderLoginScreen() {
      const list = document.getElementById('loginUsersList');
      if (!list) return;
      list.innerHTML = users.map(u => `
        <button class="user-card" type="button" onclick="loginAs('${u.username}')">
          <div class="user-card-info">
            <strong>${u.nome} ${u.cognome}</strong>
            <span>${u.ruolo} &bull; ${u.reparto || 'N/D'}</span>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      `).join('');
    }
    async function syncApiKey(key) {
      try {
        await fetch(apiUrl('/api/set-api-key'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: key || '' })
        });
      } catch (e) { console.error('Errore sync API key:', e); }
    }

    function openSetupModal() {
      const currentKey = localStorage.getItem('customApiKey') || '';
      const newKey = window.prompt("inserisci qui la tua api keys: ", currentKey);
      
      if (newKey !== null) {
        const trimmedKey = newKey.trim();
        if (trimmedKey) {
          localStorage.setItem('customApiKey', trimmedKey);
        } else {
          localStorage.removeItem('customApiKey');
        }
        syncApiKey(trimmedKey);
        alert('Configurazione API aggiornata!');
      }
    }

    const storedKey = localStorage.getItem('customApiKey');
    if (storedKey) syncApiKey(storedKey);

    renderLoginScreen();
  </script>
